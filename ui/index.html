<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Autopilot</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/core/assets/tool.css">
<script src="/core/assets/hub.js" defer></script>
<style>
/* Thin management layer over scripts/: every value shown or saved goes through the same functions the scheduled agent
   runs. Text weight 400 everywhere; states by border colour only, no shadows. Controls (inputs, selects, buttons, tabs)
   all take the one size defined in core/assets/tool.css (--ctl-h, --ctl-pad, --ctl-border, --ctl-font).
   Layout: the window is one flex column (header, tabs, the page); the page fills the rest of the height and scrolls
   inside, so there is no dead space below the content. */
* { font-weight: 400; }
b, strong, h1, h2, h3, th { font-weight: 400; }
a { color: #0b57d0; }
html, body { height: 100%; }
main { height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; min-height: 0; }
main > header, main > nav, main > .setup-status { flex: 0 0 auto; }
.page { flex: 1 1 auto; min-height: 0; overflow: auto; }
.page[hidden] { display: none; }
nav.tabs { display: flex; margin: 0 0 12px; }
nav.tabs button { height: var(--ctl-h); padding: var(--ctl-pad); font: inherit; font-size: var(--ctl-font); background: #e1e1e1; border: var(--ctl-border); margin-right: -1px; cursor: default; }
nav.tabs button:hover { border-color: #0078d7; position: relative; }
nav.tabs button[aria-pressed="true"] { background: #fff; border-color: var(--accent); position: relative; }
.cards { display: grid; gap: 10px; }
.card { background: #fff; border: 1px solid var(--line); padding: 10px 12px; }
.card.ok { border-color: var(--accent); }
.card.todo { border-color: #b06000; }
.card h3 { margin: 0 0 4px; font-size: 15px; }
.meta { color: var(--muted); font-size: 12px; }
.muted { color: var(--muted); }
.missing { margin: 4px 0 0; padding-left: 18px; color: #b06000; font-size: 12px; }
.ok-text { color: #006400; } .bad-text { color: rgb(176, 0, 0); } .warn-text { color: #b06000; }
.status-tag { display: inline-block; padding: 1px 8px; border: 1px solid var(--line); font-size: 12px; }
.status-tag.c-green { border-color: var(--accent); } .status-tag.c-amber { border-color: #b06000; } .status-tag.c-red { border-color: rgb(176, 0, 0); }
.card .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.picker { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.picker .find-row, .find-row { display: flex; gap: 8px; margin: 0 0 6px; } .find-row input { flex: 1 1 auto; min-width: 0; }
.picker .found label { display: flex; gap: 6px; align-items: center; margin: 0; padding: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle; flex: 0 0 auto; } .dot-green { background: #006400; } .dot-red { background: rgb(176, 0, 0); } .dot-grey { background: var(--line); }
.row-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
/* Toolbar: label and control on one line. */
.toolbar { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar > div { display: flex; align-items: center; gap: 8px; }
.toolbar label { margin: 0; white-space: nowrap; }
.toolbar select, .toolbar input { width: auto; min-width: 140px; }
fieldset { border: 1px solid var(--line); background: #fff; padding: 10px 12px; margin: 0 0 12px; min-width: 0; }
legend { padding: 0 4px; color: var(--ink); }
table.edit { width: 100%; border-collapse: collapse; }
table.edit th { text-align: left; color: var(--muted); font-size: 12px; padding: 4px; }
table.edit td { padding: 3px 4px; vertical-align: middle; }
.table-wrap { overflow-x: auto; }
.inline { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.inline label { display: flex; gap: 6px; align-items: center; margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 12px; }
.msg { white-space: pre-wrap; }
.msg:empty { display: none; }
textarea.prompt { min-height: 200px; font: 12.5px/1.5 Consolas, ui-monospace, monospace; }
details > summary { cursor: default; color: var(--muted); font-size: 12px; }
details[open] > summary { margin-bottom: 6px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.slot { display: flex; gap: 6px; margin-bottom: 4px; align-items: center; }
.slot select, .slot input { width: auto; }
.slot input[type=text], .src-url { flex: 1 1 auto; min-width: 0; }
.card .head-row { display: flex; align-items: center; gap: 8px; } .card .head-row h3 { flex: 1 1 auto; margin: 0 0 4px; }
/* Prompt: one options row, then Copy / Edit / Reset, then the prompt filling the rest of the window. */
#page-prompt:not([hidden]) { display: flex; flex-direction: column; overflow: hidden; }
#page-prompt .toolbar { flex: 0 0 auto; }
.seg { display: inline-flex; } .seg .btn { margin-right: -1px; } .seg .btn[aria-pressed="true"] { background: #fff; border-color: var(--accent); position: relative; }
.pr-opts input[type=number] { min-width: 0; width: 90px; } .pr-opts input[type=date] { min-width: 0; width: 140px; }
#prText { flex: 1 1 auto; min-height: 200px; width: 100%; box-sizing: border-box; resize: none; overflow: auto; }
#prText[readonly] { background: #fafafa; }
.pr-src { position: relative; }
.pr-src > summary { list-style: none; min-width: 120px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; justify-content: flex-start; color: var(--ink); font-size: var(--ctl-font); }
.pr-src > summary::-webkit-details-marker { display: none; }
details.pr-src[open] > summary { margin-bottom: 0; }
.pr-src-list { position: absolute; z-index: 5; top: calc(var(--ctl-h) - 1px); left: 0; min-width: 220px; max-height: 260px; overflow: auto; background: #fff; border: 1px solid #8a8a8a; padding: 4px 0; }
.pr-src-list label { display: flex; gap: 8px; align-items: center; margin: 0; padding: 4px 10px; white-space: nowrap; }
.pr-src-list label:hover { background: var(--hover); }
pre { white-space: pre-wrap; word-break: break-word; font: 12.5px/1.45 var(--font); margin: 4px 0 0; max-height: 220px; overflow: auto; }
/* Library */
.refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.ref img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: var(--control); display: block; border: 1px solid var(--line); }
.ref { display: grid; gap: 4px; align-content: start; }
.ref .thumb { position: relative; }
.ref .count { position: absolute; right: 4px; bottom: 4px; background: #fff; border: 1px solid var(--line); padding: 0 6px; font-size: 12px; }
.ref .head { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; min-width: 0; white-space: nowrap; }
.ref .head .title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ref .head .status-tag, .ref .head .btn { flex: 0 0 auto; }
.ref .head .btn { height: 24px; padding: 0 8px; }
.ref > .meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref .head .acts { margin-left: auto; }
.ref .none { aspect-ratio: 1 / 1; display: grid; place-items: center; border: 1px dashed var(--line); color: var(--muted); font-size: 12px; }
.ref .line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref .head .status-tag + .status-tag { margin-left: -2px; }
.ref .reject-box { position: relative; }
.count-bad { color: rgb(176, 0, 0); }
/* A click on a card (not on its buttons, links or Caption) opens it in the overlay; Enter too. */
.card.open-card { cursor: pointer; }
.card.open-card:hover { border-color: #0078d7; }
.card.open-card:focus { outline: 1px solid #0078d7; outline-offset: -1px; }
.host { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12.5px; }
.reject-box { display: flex; gap: 6px; align-items: center; } .reject-box input { flex: 1 1 auto; min-width: 0; width: auto; }
/* Preview: static mocks of a Facebook feed post and an Instagram post (no external calls). */
.pv { width: 360px; max-width: 100%; background: #fff; border: 1px solid #dadde1; border-radius: 8px; font: 14px/1.34 "Segoe UI", Helvetica, Arial, sans-serif; color: #050505; overflow: hidden; }
.pv .pv-tag { font-size: 11px; color: #65676b; padding: 6px 12px 0; }
.pv .pv-head { display: flex; gap: 8px; align-items: center; padding: 8px 12px; }
.pv .av { width: 36px; height: 36px; border-radius: 50%; background: #1b74e4; color: #fff; display: grid; place-items: center; font-size: 15px; flex: 0 0 auto; }
.pv .who { display: grid; } .pv .who b { font-size: 14px; } .pv .who span { font-size: 12px; color: #65676b; }
.pv .txt { padding: 0 12px 10px; white-space: pre-wrap; word-break: break-word; }
.pv .more { display: inline; padding: 0; color: #65676b; background: none; border: 0; font: inherit; cursor: pointer; }
.pv .more:hover { text-decoration: underline; }
.pv .pv-ro { color: #b06000; }
.pv.review { border-color: #b06000; }
.pv .media { display: grid; gap: 2px; background: #fff; }
.pv .media.n2 { grid-template-columns: 1fr 1fr; } .pv .media.n3, .pv .media.n4 { grid-template-columns: 1fr 1fr; }
.pv .media img { width: 100%; display: block; object-fit: cover; }
.pv .media.n1 img { aspect-ratio: auto; max-height: 420px; } .pv .media:not(.n1) img { aspect-ratio: 1 / 1; }
.pv .video { aspect-ratio: 16 / 9; background: #18191a; display: grid; place-items: center; }
.pv .video::after { content: ""; border-left: 22px solid #fff; border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
.pv .bar { display: flex; justify-content: space-around; border-top: 1px solid #ced0d4; margin: 0 12px; padding: 6px 0; color: #65676b; font-size: 13px; }
.pv.ig { border-radius: 0; border-color: #dbdbdb; }
.pv.ig .av { background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7); width: 32px; height: 32px; font-size: 13px; }
.pv.ig .media img { aspect-ratio: 1 / 1; max-height: none; }
.pv.ig .txt { padding: 8px 12px 10px; }
/* Thumbnails open the card's preview (never a new window). */
.thumb { display: block; padding: 0; border: 0; background: none; cursor: zoom-in; }
/* Overlay: a near-fullscreen window (95vw x 92vh) holding the lightbox (image/video, prev/next) or the Preview panel.
   Its header carries the title, channel tabs and ✕ Close; Esc or a click on the backdrop also closes. */
.lb { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, .75); display: grid; place-items: center; }
.lb[hidden] { display: none; }
.lb .lb-win { width: 95vw; height: 92vh; background: var(--control); border: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.lb .lb-head { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #fff; }
.lb .lb-title { flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb .lb-extra:empty { display: none; }
.lb .lb-head nav.tabs { margin: 0; flex-wrap: wrap; }
.lb .lb-close { margin-left: auto; }
.lb .lb-body { flex: 1 1 auto; min-height: 0; display: flex; }
.lb .lb-stage { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 0; padding: 12px; background: #111; }
.lb .lb-stage img, .lb .lb-stage video { max-width: calc(95vw - 140px); max-height: calc(92vh - 90px); object-fit: contain; min-width: 0; }
.lb .lb-nav { font-size: 20px; }
/* Preview: the post at Facebook's feed width on the left, the post's facts on the right (below when narrow). */
.lb .pv-layout { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
.lb .pv-stage { overflow: auto; background: #f0f2f5; padding: 16px; display: flex; justify-content: center; align-items: flex-start; }
.lb .pv-col { width: 540px; max-width: 100%; flex: 0 0 auto; display: grid; gap: 10px; align-content: start; }
.lb .pv-langs { margin: 0; }
.lb .pv-langs .meta { margin-left: 4px; }
.lb .pv-stage .pv { width: 100%; font-size: 15px; }
.lb .pv-stage .pv .media.n1 img { max-height: none; height: auto; object-fit: contain; background: #f0f2f5; }
.pv .txt a { color: #385898; text-decoration: none; } .pv .txt a:hover { text-decoration: underline; }
.pv .txt .tag { color: #385898; }
/* Several images of a library post: one at a time at full width, ‹ › and n/m over it (like a carousel). */
.pv .car { position: relative; background: #f0f2f5; }
.pv .car img { width: 100%; height: auto; display: block; cursor: zoom-in; }
.pv .car .car-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; border: 1px solid #ced0d4; background: #fff; font-size: 20px; line-height: 1; cursor: pointer; color: #050505; }
.pv .car .car-nav.prev { left: 8px; } .pv .car .car-nav.next { right: 8px; }
.pv .car .car-count { position: absolute; right: 8px; top: 8px; background: rgba(0, 0, 0, .6); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 10px; }
.lb .pv-side { overflow: auto; padding: 12px; border-left: 1px solid var(--line); background: #fff; display: grid; gap: 10px; align-content: start; }
.lb .pv-side .kv dd { overflow-wrap: anywhere; }
.lb .pv-side pre { max-height: none; }
.lb .pv-side .row-actions { margin-top: 0; }
.lb .item-nav { display: flex; align-items: center; gap: 6px; }
.lb .sp-layout { grid-template-columns: minmax(0, 1fr) 380px; }
.lb .sp-dups { margin: 0; padding-left: 18px; font-size: 12px; }
.lb .sp-dups a { overflow-wrap: anywhere; }
@media (max-width: 900px) {
  .lb .pv-layout { grid-template-columns: 1fr; overflow: auto; }
  .lb .pv-stage { overflow: visible; }
  .lb .pv-side { border-left: 0; border-top: 1px solid var(--line); }
}
.pv [data-pv] { cursor: zoom-in; }
/* Settings: short labels in a fixed column, compact rows, a 2-column form. */
#page-settings .kv { grid-template-columns: 160px minmax(0, 1fr); align-items: center; }
#page-settings .kv dt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#page-settings .kv dd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: var(--ctl-h); }
#page-settings .set-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; align-items: end; }
#page-settings .set-grid > div { min-width: 0; }
#page-settings .set-grid .wide { grid-column: 1 / -1; }
#page-settings .set-grid label { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 0 4px; }
#page-settings .set-grid label.check { display: flex; gap: 6px; align-items: center; height: var(--ctl-h); margin: 0; }
#page-settings details > summary { margin: 10px 0 6px; }
#page-settings legend .btn { margin-left: 8px; height: 24px; }
@media (max-width: 600px) {
  #page-settings .kv, #page-settings .set-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main>
  <header><img src="/icon.svg" alt=""><h1>Social Autopilot</h1></header>
  <div id="setupStatus" class="setup-status" hidden></div>
  <nav class="tabs" id="tabs">
    <button type="button" data-page="overview">Overview</button>
    <button type="button" data-page="store">Library</button>
    <button type="button" data-page="posts">Posts</button>
    <button type="button" data-page="prompt">Prompt</button>
    <button type="button" data-page="settings">Settings</button>
  </nav>

  <section class="page" id="page-overview" hidden>
    <div class="msg" id="ovMsg"></div>
    <div class="cards" id="ovList"><div class="meta">Loading…</div></div>
  </section>

  <section class="page" id="page-store" hidden>
    <div class="toolbar">
      <div><label for="resBrand">Library</label><select id="resBrand"></select></div>
      <div><label for="resStatus">Show</label><select id="resStatus">
        <option value="new">New</option><option value="used">Used</option><option value="rejected">Dropped</option><option value="">All</option></select></div>
      <div><label for="resSource">Source</label><select id="resSource"></select></div>
    </div>
    <div id="resBody" class="meta">Pick a brand.</div>
  </section>

  <section class="page" id="page-posts" hidden>
    <div class="toolbar">
      <div><label for="drBrand">Brand</label><select id="drBrand"><option value="">All</option></select></div>
      <span class="seg" id="drState" role="group" aria-label="Show"></span>
      <span class="meta" id="drExtra"></span>
    </div>
    <div id="draftList"></div>
  </section>

  <section class="page" id="page-prompt" hidden>
    <!-- One options row: mode, agent, brand, then only the options of the chosen mode. -->
    <div class="toolbar pr-opts">
      <span class="seg" id="prMode" role="group" aria-label="Mode"></span>
      <div><label for="prAgent">Agent</label><select id="prAgent"></select></div>
      <div><label for="prBrand">Brand</label><select id="prBrand"></select></div>
      <span id="prResearch" hidden style="display:contents">
        <div><label>Sources</label><details class="pr-src" id="prSrcBox"><summary class="btn" id="prSrcSum">All</summary><div class="pr-src-list" id="prSrc"></div></details></div>
        <div><label for="prSince">Since</label><input type="date" id="prSince"></div>
        <div><label for="prMax" title="Max posts per source">Max posts</label><input type="number" id="prMax" min="1" step="1" placeholder="no limit"></div>
        <div><label for="prKind">Crawl</label><select id="prKind"><option value="new">New posts</option><option value="backfill">Backfill older</option><option value="full">Full rescan</option></select></div>
      </span>
      <span id="prMake" hidden style="display:contents">
        <div><label for="prCount">Posts</label><input type="number" id="prCount" min="1" step="1"></div>
      </span>
    </div>
    <div class="toolbar">
      <button class="btn primary" type="button" id="prCopy">Copy prompt</button>
      <button class="btn" type="button" id="prEdit">Edit</button>
      <button class="btn" type="button" id="prReset">Reset</button>
      <span class="meta" id="prMsg">Paste into Claude Code / Codex opened in the tool folder</span>
    </div>
    <textarea class="prompt" id="prText" spellcheck="false" readonly></textarea>
  </section>

  <section class="page" id="page-settings" hidden>
    <fieldset><legend>Accounts</legend>
      <dl class="kv" id="setAccounts"><dt>Codex (ChatGPT)</dt><dd class="meta">Checking…</dd></dl>
      <div class="msg" id="setLoginMsg"></div>
    </fieldset>
    <fieldset><legend>Requirements<button class="btn" type="button" id="setRecheck">Re-check</button></legend>
      <dl class="kv" id="setReqs"><dt>Node.js</dt><dd class="meta">Checking…</dd></dl>
    </fieldset>
    <fieldset><legend>Tool settings</legend>
      <div id="settingsView"></div>
      <div class="row-actions"><button class="btn" type="button" id="settingsEdit">Edit</button></div>
      <div id="settingsEditor" hidden>
        <form id="settingsForm"></form>
        <div class="row-actions"><button class="btn primary" type="button" id="settingsSave" title="Saved to this machine's workspace/settings.json">Save</button></div>
      </div>
      <div class="msg" id="settingsMsg"></div>
    </fieldset>
  </section>

  <section class="page" id="page-brand" hidden>
    <div class="toolbar"><button class="btn" type="button" id="brandBack">← Overview</button><h2 id="brandTitle" style="margin:0;font-size:16px"></h2></div>
    <div id="brandForm"></div>
    <div class="row-actions"><button class="btn primary" type="button" id="brandSave" title="After saving, the skill's check-skill runs; a broken file is put back">Save</button></div>
    <div class="msg" id="brandMsg"></div>
  </section>
</main>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const arr = (x) => (Array.isArray(x) ? x : []);
  // Every request of the page goes through call(): GET without data, POST with it.
  // Every write carries the session token the server puts in this page (meta sa-token); without it the server refuses.
  const call = (url, data) => fetch(url, data === undefined ? { cache: "no-store" } : { method: "POST", headers: { "content-type": "application/json", "x-sa-token": document.querySelector('meta[name="sa-token"]')?.content || "" }, body: JSON.stringify(data) }).then((r) => r.json());
  const getJson = (url) => call(url);
  const postJson = (url, data) => call(url, data);
  const img = (p) => `/file?path=${encodeURIComponent(p)}`;
  const store = { get: (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  const offline = { error: "Lost connection to the app." };
  const RESTART = "Restart the app to load the update (Reload, top right).";
  // A short error in the page, the long one in its tooltip.
  const errLine = (e) => { const t = String(e || ""); const first = t.split(/\r?\n/)[0].slice(0, 200); return `<span class="bad-text" title="${esc(t)}">${esc(first)}${first.length < t.length ? "…" : ""}</span>`; };
  addEventListener("error", (e) => postJson("/api/client-error", { message: e.message, stack: e.error?.stack || "" }).catch(() => {}));
  // A page whose data does not have the expected shape (a server started before an update): a clear message, no crash.
  const safely = (where, fn) => async (...a) => { try { return await fn(...a); } catch (e) { postJson("/api/client-error", { message: `${where}: ${e.message}`, stack: e.stack || "" }).catch(() => {}); const box = $(where); if (box) box.innerHTML = `<div class="bad-text" title="${esc(e.message)}">${RESTART}</div>`; } };

  // ----- tabs -----
  const pages = ["overview", "store", "posts", "prompt", "settings", "brand"];
  function show(page) {
    if (!pages.includes(page)) page = "overview";
    for (const p of pages) $(`#page-${p}`).hidden = p !== page;
    for (const b of $$("#tabs button")) b.setAttribute("aria-pressed", String(b.dataset.page === (page === "brand" ? "overview" : page)));
    store.set("page", page === "brand" ? "overview" : page);
    ({ overview: loadOverview, store: loadResearch, posts: loadDrafts, prompt: loadPrompts, settings: loadSettings })[page]?.();
  }
  for (const b of $$("#tabs button")) b.onclick = () => show(b.dataset.page);
  // core/assets/hub.js opens Settings when the setup is incomplete (its banner's button too).

  // ----- Overview: per brand, from queue.mjs (library, last research, posts, Metricool) + the skill check -----
  let brandData = { brands: [], metricool: { brands: [] } };
  const MC_TEXT = { draft: "waiting to send (old Metricool draft)", scheduled: "scheduled", published: "published", error: "Metricool error", not_sent: "not sent" };
  // Skill picker (Choose skill / Change skill): a source folder (or a skill folder path pasted), Find, the skill folders

  let skillSource = "";
  async function skillPicker(panel, mcName) {

      const state = (x) => x.ready ? `<span class="dot dot-green"></span><span class="ok-text">Usable</span>` : `<span class="dot dot-red"></span><span class="bad-text" title="${esc(arr(x.problems).join("\n"))}">Missing ${arr(x.problems).length || 1}</span>`;
      panel.querySelector(".found").innerHTML = list.map((x, i) => `<label title="${esc(x.dir)}"><input type="radio" name="pick-${esc(mcName)}" value="${esc(x.dir)}"${i ? "" : " checked"}> ${esc(x.brand || x.id)} <span class="meta">${esc(x.id)}${x.linked_to ? " · linked" : ""}</span> ${state(x)}</label>`).join("")

  }
  const ovMsg = (r, ok) => { $("#ovMsg").innerHTML = r.error ? errLine(r.error) : `<span class="ok-text">${esc(ok)}</span>`; if (!r.error) loadOverview(); };
  const loadOverview = safely("#ovList", async () => {
    const [q, b] = await Promise.all([getJson("/api/queue"), getJson("/api/brands")]).catch(() => [offline, {}]);
    if (q.error) { $("#ovList").innerHTML = errLine(q.error); return; }
    if (b.error) { $("#ovList").innerHTML = errLine(b.error); return; }
    if (b.brands) brandData = b;
    const num = (o, k) => o?.[k] || 0;
    const NET = { facebook: "Facebook", instagram: "Instagram", youtube: "YouTube", tiktok: "TikTok", linkedin: "LinkedIn", twitter: "X", threads: "Threads", pinterest: "Pinterest", gmb: "Google Business" };
    const net = (n) => NET[n] || n;
    const mcBrands = arr(b.metricool?.brands).filter((m) => !m.removed);
    // Every brand in one list: each Metricool brand (with its skill or not), then each skill not linked to a Metricool
    // brand. "Missing" = everything the brand still needs to run, in plain words; empty = ready.
    const skills = Object.fromEntries(arr(b.brands).map((s) => [s.id, s]));
    const queue = Object.fromEntries(arr(q.brands).map((x) => [x.brand, x]));
    const rows = [...mcBrands.map((m) => ({ m, id: m.skill_id || "" })),
      ...arr(b.brands).filter((s) => !mcBrands.some((m) => m.skill_id === s.id)).map((s) => ({ m: null, id: s.id }))];
    const missingOf = ({ m, id }) => {
      const s = skills[id], out = [];
      if (!m) out.push("Not linked to a Metricool brand");
      if (!s) out.push(m?.skill_id && m.skill_path_missing ? "Skill folder not found (renamed or moved?)" : "No skill");
      if (s) {
        if (!s.enabled) out.push("Not enabled (Edit, Run automatically)");
        if (!arr(s.sources).length) out.push("No reference sources (Edit, Sources)");
        if (m) for (const c of arr(s.channels)) if (!arr(m.networks).includes(c)) out.push(`${net(c)} not connected in Metricool`);
        if (m?.tz_conflict) out.push(`social.json timezone (${s.metricool_timezone}) differs from the Metricool brand (${m.timezone}) (Edit, Advanced: metricool.timezone)`);
        for (const p of arr(s.problems)) out.push(p);
      }
      return [...new Set(out)];
    };
    // Card actions (top right): linked skill Edit · Change skill · Unlink; a Metricool brand without a skill Choose skill;
    // a skill without a Metricool brand Edit · Link. The skill folder itself is never moved or deleted.
    const mcFree = mcBrands.filter((m) => !m.skill_id || !skills[m.skill_id]);
    const actions = ({ m, id }) => {
      const s = skills[id], out = [];
      const btn = (attr, v, text, tip = "") => `<button class="btn" type="button" ${attr}="${esc(v)}"${tip ? ` title="${esc(tip)}"` : ""}>${text}</button>`;
      if (s) out.push(btn("data-edit", s.id, "Edit"));
      if (m && !s && !m.skill_id) out.push(btn("data-pick", m.name, "Choose skill", "Link this brand to a skill folder"));
      if (m && !s && m.skill_id) out.push(btn("data-pick", m.name, "Change skill", "Point this brand to the skill folder's new place"), btn("data-unlink", m.name, "Unlink", "Remove the link to the skill folder"));
      if (m && s) out.push(btn("data-pick", m.name, "Change skill", "Link this brand to another skill folder"), btn("data-unlink", m.name, "Unlink", "The tool stops making and sending posts for this brand; the skill folder and library stay"));
      if (!m && s && mcFree.length) out.push(btn("data-connect", s.dir, "Link", "Link this skill to a Metricool brand"));
      return `<div class="acts">${out.join("")}</div>`;
    };
    // Short card: only rows that say something; a counter shows only when > 0. The dot: ready (green) or missing (red).
    const card = (row) => {
      const { m, id } = row, s = skills[id], x = queue[id], miss = missingOf(row);
      const name = m?.name || s?.brand || id;
      const r = x?.research, st = x?.store, d = x?.drafts || {}, mc = x?.metricool || {};
      const working = num(d, "needs_prompt") + num(d, "generating") + num(d, "needs_caption"), failed = num(d, "check_failed") + num(d, "image_failed");
      const parts = (list) => list.filter(Boolean).join(" · ");
      const none = `<span class="muted">No posts yet</span>`;
      const kho = st?.total ? parts([`<a href="#" data-go="store" data-brand="${esc(id)}">${st.total} posts</a>`, st.new && `${st.new} new`, st.used && `${st.used} used`, st.rejected && `${st.rejected} dropped`]) : none;
      const research = r?.latest ? parts([esc(r.latest), r.new_last_crawl && `${r.new_last_crawl} new`, r.duplicates_last_crawl && `${r.duplicates_last_crawl} duplicates skipped`, arr(r.pending).length && `unfinished: ${esc(arr(r.pending).join(", "))}`]) : "";
      const blocked = arr(r?.blocked).length ? `<div class="bad-text">Blocked: ${esc(arr(r.blocked).join("; "))}</div>` : "";
      const written = arr(x?.written).length;
      const posted = mc.published || 0, review = num(d, "ready");
      const go = (k, n, t) => `<a href="#" data-go="posts" data-state="${k}" data-brand="${esc(id)}">${t} (${n})</a>`;
      const posts = written || review || posted ? [go("review", review, "To review"), go("queued", Math.max(0, written - posted), "Queued"), go("posted", posted, "Posted")].join(" · ") + (failed ? ` · <span class="bad-text">${failed} failed</span>` : "") + (working ? ` · <span class="muted">${working} in progress</span>` : "") : working ? `<span class="muted">${working} in progress</span>` : none;
      return `<div class="card ${miss.length ? "todo" : "ok"}">
        <div class="head-row"><h3><span class="dot ${miss.length ? "dot-red" : "dot-green"}" title="${miss.length ? "Missing" : "Ready"}" aria-label="${miss.length ? "Missing" : "Ready"}"></span>${esc(name)}</h3>${actions(row)}</div>
        <dl class="kv">
          <dt>Metricool</dt><dd>${m ? `${esc(m.name)} · ${esc(arr(m.networks).map(net).join(", ") || "no channels")} · ${esc(m.timezone || "-")}` : `<span class="muted">No Metricool brand</span>`}</dd>
          ${s ? `<dt>Skill</dt><dd>${esc(s.id)}</dd>` : ""}
          ${x ? `<dt>Library</dt><dd>${kho}</dd>
          ${research || blocked ? `<dt>Last research</dt><dd>${research}${blocked}</dd>` : ""}
          <dt>Posts</dt><dd>${posts}</dd>
` : ""}
          ${miss.length ? `<dt>Missing</dt><dd><ul class="missing" style="margin:0">${miss.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></dd>` : ""}

      </div>`;
    };
    const acc = b.metricool || {};
    const synced = acc.updated_at ? `Metricool brands updated ${esc(String(acc.updated_at).slice(0, 16).replace("T", " "))}` : "Run Create &amp; publish once to load the Metricool brands (it refreshes them from Metricool first).";
    $("#ovList").innerHTML = `<div class="meta">${synced}</div>` + (rows.map(card).join("") || `<div class="meta">No brands yet.</div>`);
    for (const btn of $$("#ovList [data-edit]")) btn.onclick = () => openBrand(btn.dataset.edit);

      panel.querySelector("button").onclick = async () => ovMsg(await postJson("/api/metricool-link", { name: panel.querySelector("select").value, skill_path: btn.dataset.connect }).catch(() => offline), "Linked.");

      e.preventDefault();

      if (a.dataset.go === "posts") { store.set("drBrand", a.dataset.brand); drState = a.dataset.state || ""; store.set("drState", drState); }
      show(a.dataset.go);

  });

  // ----- Edit a brand: only what people change; the rest under Advanced (raw JSON) -----
  let editing = null;
  const DAYS = [["mon", "Mon"], ["tue", "Tue"], ["wed", "Wed"], ["thu", "Thu"], ["fri", "Fri"], ["sat", "Sat"], ["sun", "Sun"]];
  const slug = (u) => "src-" + u.replace(/^https?:\/\/(www\.)?/, "").replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "").toLowerCase().slice(0, 40);
  async function openBrand(id) {
    $("#brandMsg").textContent = "";
    const r = await getJson(`/api/brand?id=${encodeURIComponent(id)}`).catch(() => offline);
    if (r.error || !r.social) { $("#brandForm").innerHTML = ""; $("#brandTitle").textContent = id; $("#brandMsg").innerHTML = errLine(r.error || RESTART); show("brand"); return; }
    editing = { id, social: r.social, file: r.file };
    const s = r.social, cad = s.cadence || {};
    const slots = arr(cad.slots), sources = arr(s.research?.sources), channels = arr(s.channels);
    $("#brandTitle").textContent = s.brand || id;
    $("#brandForm").innerHTML = `<fieldset>
      <div class="inline"><label><input type="checkbox" id="fEnabled"${s.enabled ? " checked" : ""}> Run automatically</label>

      <label>Channels</label><div class="inline" id="fChannels">${channels.map((c, i) => `<label><input type="checkbox" data-c="${i}"${c.enabled ? " checked" : ""}> ${esc(c.network)}</label>`).join("") || `<span class="meta">No channels.</span>`}</div>
      <div class="grid2"><div><label for="fPpw">Posts per week</label><input type="number" id="fPpw" min="0" step="1" value="${esc(cad.posts_per_week ?? "")}"></div></div>

      <div class="slot"><input type="text" id="fNewSrc" placeholder="Add a source: paste the page URL"><button class="btn" type="button" id="addSrc">Add</button></div>
    </fieldset>`;
    $("#fOpen").onclick = async () => { const x = await postJson("/api/open-skill", { id }).catch(() => offline); if (x.error) $("#brandMsg").innerHTML = errLine(x.error); };

    $("#fSlots").onclick = (e) => { if (e.target.dataset.rm) e.target.closest(".slot").remove(); };
    $("#fSources").onclick = (e) => { if (e.target.dataset.rmsrc) { const row = e.target.closest(".slot"); if (row.dataset.i !== undefined) (editing.removed ||= []).push(Number(row.dataset.i)); row.remove(); } };

      const u = $("#fNewSrc").value.trim();

      $("#fSources").insertAdjacentHTML("beforeend", `<div class="slot"><input type="checkbox" checked disabled><span class="src-url">${esc(u)} <span class="meta">(new, Save to keep)</span></span></div>`);
      $("#fNewSrc").value = ""; $("#brandMsg").textContent = "";
    };
    show("brand");
  }
  const slotRow = (x) => `<div class="slot"><select>${DAYS.map(([v, t]) => `<option value="${v}"${x.day === v ? " selected" : ""}>${t}</option>`).join("")}</select><input type="text" value="${esc(x.time || "")}" placeholder="10:00" style="max-width:80px;flex:0 0 80px"><button class="btn" type="button" data-rm="1">Remove</button></div>`;
  $("#brandBack").onclick = () => show("overview");
  $("#brandSave").onclick = async () => {
    const msg = $("#brandMsg");

    const cad = (social.cadence ||= {});
    const ppw = $("#fPpw").value.trim();

    cad.slots = $$("#fSlots .slot").map((row) => ({ day: $("select", row).value, time: $("input", row).value.trim() })).filter((x) => x.time);
    const src = (social.research ||= {}).sources ||= [];
    $$("#fSources .slot[data-i]").forEach((row) => { src[Number(row.dataset.i)].enabled = $("input", row).checked; });
    social.research.sources = src.filter((_, i) => !(editing.removed || []).includes(i));
    for (const a of editing.added || []) if (!social.research.sources.some((x) => x.id === a.id)) social.research.sources.push(a);
