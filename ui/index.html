    const r = await postJson(`/api/brand?id=${encodeURIComponent(editing.id)}`, { social }).catch(() => offline);
    if (r.error) msg.innerHTML = errLine(r.error);
    else if (!r.saved) msg.innerHTML = `<span class="bad-text" title="${esc(arr(r.errors).join("\n"))}">Not saved; the previous file was kept (${arr(r.errors).length} problems).</span>`;
    else { msg.innerHTML = `<span class="ok-text">Saved.${r.tool_ready ? " Ready for the tool." : ` Missing ${arr(r.missing).length} items.`}</span>`; editing.added = []; editing.removed = []; setTimeout(() => show("overview"), 900); }
  };

  // ----- Library: the research store of each brand, kept apart per brand; "Drop" = never used for posts -----
  const ITEM_TEXT = { new: "New", used: "Used", rejected: "Dropped" };
  const ITEM_COLOR = { new: "c-green", used: "", rejected: "c-red" };
  const STATE_TEXT = { end: "end of page", known: "reached known posts", since: "reached the date", limit: "post limit", blocked: "blocked", partial: "stopped midway" };
  let resShown = 60;
  // Cards that open in the overlay: a click anywhere except buttons, links, inputs and the Caption toggle; Enter too.
  function wireCards(cards, open) {
    cards.forEach((card, i) => {
      card.classList.add("open-card");
      card.tabIndex = 0;
      card.onclick = (e) => { if (e.target.closest("a, button:not(.thumb), input, textarea, select, summary, .reject-box")) return; open(i); };
      card.onkeydown = (e) => { if (e.target === card && e.key === "Enter") { e.preventDefault(); open(i); } };
    });
  }
  // After the overlay closes: back to the card last shown (when it is still on the page).
  function focusCard(sel, id) { $$(sel).find((c) => c.dataset.id === id)?.focus(); }
  // ‹ Prev / Next › of the overlay header, the same for both lists.
  const itemNav = (i, n) => `<span class="item-nav"><button class="btn" type="button" data-item="-1"${i ? "" : " disabled"}>‹ Prev</button><span class="meta">${i + 1}/${n}</span><button class="btn" type="button" data-item="1"${i < n - 1 ? "" : " disabled"}>Next ›</button></span>`;
  const loadResearch = safely("#resBody", async () => {
    const brand = $("#resBrand").value || store.get("resBrand"), status = $("#resStatus").value, source = $("#resSource").value;
    const r = await getJson(`/api/store?brand=${encodeURIComponent(brand || "")}&status=${encodeURIComponent(status)}&source=${encodeURIComponent(source || "")}`).catch(() => offline);
    if (r.error) { $("#resBody").innerHTML = errLine(r.error); return; }
    $("#resBrand").innerHTML = `<option value="">Pick…</option>` + arr(r.brands).map((b) => `<option value="${esc(b.id)}"${b.id === brand ? " selected" : ""}>${esc(b.name || b.id)} (${b.counts?.total ?? 0} posts, ${b.counts?.new ?? 0} new)</option>`).join("");
    const c = r.current;
    if (!c) { $("#resSource").innerHTML = ""; $("#resBody").innerHTML = `<div class="meta">Pick a brand.</div>`; return; }
    $("#resSource").innerHTML = `<option value="">All</option>` + arr(c.sources).map((s) => `<option${s === source ? " selected" : ""}>${esc(s)}</option>`).join("");
    const k = c.counts || {};
    const items = arr(c.items), ideas = arr(c.ideas);
    const prog = Object.entries(c.progress || {});
    const progress = prog.length ? `<details><summary>Crawl progress by source</summary><div class="table-wrap"><table class="edit"><thead><tr><th>Source</th><th>Last run</th><th>Result</th><th>Reached end</th><th>In library</th><th>Newest</th></tr></thead><tbody>${prog.map(([id, p]) => `<tr><td>${esc(id)}</td><td>${esc(String(p.last_crawl || "").slice(0, 16).replace("T", " "))}</td><td class="${p.blocked ? "bad-text" : ""}">${esc(STATE_TEXT[p.last_result?.state] || p.last_result?.state || "-")}${p.last_result?.note ? `: ${esc(p.last_result.note)}` : ""} (${esc(p.last_result?.new ?? 0)} new)</td><td>${p.reached_end ? "yes" : "no"}</td><td>${esc(p.items)}</td><td>${esc(p.newest_posted_date || "-")}</td></tr>`).join("")}</tbody></table></div></details>` : "";
    const list = items.slice(0, resShown);
    $("#resBody").innerHTML = `<div class="meta">${k.total ?? 0} posts · ${k.new ?? 0} new · ${k.used ?? 0} used · ${k.rejected ?? 0} dropped. Showing ${items.length}.</div>${progress}
      <div class="refs" style="margin-top:8px">${list.map((it) => `<div class="card ref" data-id="${esc(it.id)}">
        ${arr(it.image_paths).length ? `<button class="thumb" type="button" title="View"><img loading="lazy" src="${img(it.image_paths[0])}" alt=""></button>` : `<div class="none">No image</div>`}
        <div class="head"><span class="title">${esc(it.id)}</span><span class="status-tag ${ITEM_COLOR[it.status] || ""}">${ITEM_TEXT[it.status] || esc(it.status)}</span>${it.status === "rejected" ? `<button class="btn" type="button" data-restore>Restore</button>` : it.status === "new" ? `<button class="btn" type="button" data-reject>Drop</button>` : ""}</div>
        <div class="meta">${esc(it.source_id)}${it.posted_date ? ` · ${esc(it.posted_date)}` : ""}</div></div>`).join("") || `<div class="meta">Nothing matches this filter.</div>`}</div>
      ${items.length > resShown ? `<div class="row-actions"><button class="btn" type="button" id="resMore">Show more (${items.length - resShown})</button></div>` : ""}
      <fieldset style="margin-top:12px"><legend>Ideas from the library</legend>${ideas.length ? `<div class="table-wrap"><table class="edit"><thead><tr><th>id</th><th>Library post</th><th>Status</th><th>Product</th><th>Scene</th><th>Drafts</th></tr></thead><tbody>${ideas.slice().reverse().map((i) => `<tr><td>${esc(i.id)}</td><td>${esc(i.item)}</td><td>${esc(i.status)}</td><td>${esc(i.product_type)}</td><td>${esc(i.scene)}</td><td>${esc(arr(i.drafts).join(", "))}</td></tr>`).join("")}</tbody></table></div>` : `<div class="meta">No ideas yet ("Create & publish" mode).</div>`}</fieldset>`;
    if ($("#resMore")) $("#resMore").onclick = () => { resShown += 60; loadResearch(); };
    const cards = $$("#resBody .ref");
    wireCards(cards, (i) => openStoreItem(c.brand, list.slice(), i));
    for (const card of cards) {
      const it = items.find((x) => x.id === card.dataset.id);
      const setStatus = async (status, note = "") => {
        const res = await postJson("/api/store-item", { brand: c.brand, id: it.id, status, note }).catch(() => offline);
        if (res.error) { card.insertAdjacentHTML("beforeend", `<div>${errLine(res.error)}</div>`); return; }
        loadResearch();
      };
      if ($("[data-reject]", card)) $("[data-reject]", card).onclick = () => { if (confirm(`Drop ${it.id}? It will never be used for posts.`)) setStatus("rejected", ""); };
      if ($("[data-restore]", card)) $("[data-restore]", card).onclick = () => setStatus("new");
    }
  });
  // One library item in the overlay: images (‹ ›, ←/→) left; facts, caption, duplicates, Drop/Restore right;
  // ‹ Prev / Next › (↑/↓) walk the filtered list without closing.
  function openStoreItem(brand, items, start) {
    let i = start, k = 0, msg = "";
    const go = (step) => { if (items[i + step]) { i += step; k = 0; msg = ""; draw(); } };
    const draw = () => {
      const it = items[i], imgs = arr(it.image_paths);
      k = Math.min(k, Math.max(0, imgs.length - 1));
      const nav = itemNav(i, items.length);
      const page = it.store || it.source_id || "?";
      const media = !imgs.length ? `<div class="video" style="aspect-ratio:1/1;background:#e4e6eb"></div>`
        : imgs.length === 1 ? `<div class="media n1"><img src="${img(imgs[0])}" alt="" data-big="0"></div>`
        : `<div class="car"><img src="${img(imgs[k])}" alt="" data-big><button class="car-nav prev" type="button" data-img="-1" aria-label="Previous image">‹</button><button class="car-nav next" type="button" data-img="1" aria-label="Next image">›</button><span class="car-count">${k + 1}/${imgs.length}</span></div>`;
      const post = `<div class="pv fb"><div class="pv-tag">Source post · ${esc(it.source_id)}</div>
        <div class="pv-head"><div class="av">${esc(String(page).trim().charAt(0).toUpperCase())}</div><div class="who"><b>${esc(page)}</b><span>${esc(it.posted_date || `captured ${String(it.captured || "").slice(0, 10)}`)} · Public</span></div></div>
        <div class="txt">${it.caption ? postText(it.caption) : `<span class="muted">(no caption)</span>`}</div>${media}<div class="bar"><span>Like</span><span>Comment</span><span>Share</span></div></div>`;
      const stage = `<div class="pv-stage"><div class="pv-col">${post}</div></div>`;
      const dups = arr(it.duplicates);
      const merged = arr(it.post_keys).length;
      const link = (u, t) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t || u)}</a>`;
      const side = `<dl class="kv">
          <dt>Status</dt><dd><span class="status-tag ${ITEM_COLOR[it.status] || ""}">${ITEM_TEXT[it.status] || esc(it.status)}</span>${it.note ? ` <span class="meta">Reason: ${esc(it.note)}</span>` : ""}</dd>
          <dt>Source</dt><dd>${it.source_url ? link(it.source_url, it.store || it.source_id) : esc(it.store || it.source_id)}</dd>
          <dt>Original</dt><dd>${it.post_url ? link(it.post_url, "Open original ↗") : "-"}</dd>
          <dt>Posted</dt><dd>${esc(it.posted_date || "-")}</dd>
          <dt>Captured</dt><dd>${esc(String(it.captured || "-").slice(0, 16).replace("T", " "))}</dd>
          <dt>Images</dt><dd>${imgs.length}</dd>
          ${it.main_product ? `<dt>Product</dt><dd>${esc(it.main_product)}</dd>` : ""}${it.price_seen ? `<dt>Price seen</dt><dd>${esc(it.price_seen)}</dd>` : ""}
          ${arr(it.used_by).length ? `<dt>Used for</dt><dd>${esc(it.used_by.join(", "))}</dd>` : ""}
        </dl>
        <div><div class="meta">Duplicates</div>${dups.length || merged > 1 ? `<ul class="sp-dups">${merged > 1 ? `<li>One post, ${merged} links (merged when captured)</li>` : ""}${dups.map((x) => `<li>${esc(x.reason)}${x.detail ? ` (${esc(x.detail)})` : ""} · ${esc(x.source)} · ${esc(String(x.at).slice(0, 10))}${x.post_url ? ` · ${link(x.post_url, "duplicate")}` : ""}</li>`).join("")}</ul>` : `<div class="meta">No duplicates.</div>`}</div>
        <div class="row-actions">${it.status === "rejected" ? `<button class="btn" type="button" data-restore>Restore</button>` : it.status === "new" ? `<button class="btn" type="button" data-reject>Drop</button>` : `<span class="meta">Used for a post; cannot be dropped.</span>`}</div>
        <div class="reject-box" hidden><input type="text" placeholder="Reason (optional)"><button class="btn" type="button" data-confirm>Confirm drop</button></div>
        <div class="msg">${msg}</div>`;
      openOverlay(`Library ${esc(brand)} · ${esc(it.id)}`, `<div class="pv-layout sp-layout">${stage}<div class="pv-side">${side}</div></div>`,
        imgs.length > 1 ? (s) => { k = (k + s + imgs.length) % imgs.length; $(".car img", overlay).src = img(imgs[k]); $(".car-count", overlay).textContent = `${k + 1}/${imgs.length}`; } : null, nav, go);
      lbOnClose = () => focusCard("#resBody .ref", it.id);
      for (const b of $$("[data-item]", overlay)) b.onclick = () => go(Number(b.dataset.item));
      for (const b of $$("[data-img]", overlay)) b.onclick = () => lbKeys(Number(b.dataset.img));
      // The image large (lightbox); closing it comes back to this post.
      for (const m of $$("[data-big]", overlay)) m.onclick = () => { openLightbox(imgs.map((x, j) => ({ type: "image", path: x, label: `${it.id} ${j + 1}/${imgs.length}` })), k); lbOnClose = draw; };
      const box = $(".pv-side", overlay);
      const setStatus = async (status, note = "") => {
        for (const b of $$(".btn", box)) b.disabled = true;
        const res = await postJson("/api/store-item", { brand, id: it.id, status, note }).catch(() => offline);
        if (res.error) { msg = errLine(res.error); draw(); return; }
        items[i] = { ...it, ...res.item, image_paths: it.image_paths, duplicates: it.duplicates };
        msg = `<span class="ok-text">${status === "new" ? "Restored." : "Dropped."}</span>`;
        draw();
        loadResearch();
      };
      if ($("[data-reject]", box)) $("[data-reject]", box).onclick = () => { const r = $(".reject-box", box); r.hidden = !r.hidden; if (!r.hidden) $("input", r).focus(); };
      if ($("[data-confirm]", box)) $("[data-confirm]", box).onclick = () => setStatus("rejected", $(".reject-box input", box).value);
      if ($(".reject-box input", box)) $(".reject-box input", box).onkeydown = (e) => { if (e.key === "Enter") setStatus("rejected", e.target.value); };
      if ($("[data-restore]", box)) $("[data-restore]", box).onclick = () => setStatus("new");
    };
    draw();
  }
  $("#resStatus").value = store.get("resStatus") || "new";
  $("#resBrand").onchange = () => { store.set("resBrand", $("#resBrand").value); $("#resSource").value = ""; resShown = 60; loadResearch(); };
  $("#resStatus").onchange = () => { store.set("resStatus", $("#resStatus").value); resShown = 60; loadResearch(); };
  $("#resSource").onchange = () => { resShown = 60; loadResearch(); };

  // ----- Prompt: the short prompts of docs/scheduled-prompt.md (mode x agent); brand and this run's options filled in.
  // The prompt is read-only until Edit; Reset rebuilds it from the template and the options. -----
  let promptData = { prompts: [], brands: [] };
  let prMode = "", prKey = "", prBase = "";
  const isResearch = (m) => /research/i.test(m);
  function drawPrompt() {
    const prompts = arr(promptData.prompts), brands = arr(promptData.brands);
    const modes = [...new Set(prompts.map((p) => p.mode))];
    prMode = modes.includes(prMode) ? prMode : modes.includes(store.get("prMode")) ? store.get("prMode") : modes[0] || "";
    $("#prMode").innerHTML = modes.map((m) => `<button class="btn" type="button" data-mode="${esc(m)}" aria-pressed="${m === prMode}">${esc(m)}</button>`).join("");
    for (const b of $$("#prMode button")) b.onclick = () => { prMode = b.dataset.mode; store.set("prMode", prMode); drawPrompt(); };
    const agents = prompts.filter((p) => p.mode === prMode).map((p) => p.agent);
    const agent = agents.includes($("#prAgent").value) ? $("#prAgent").value : agents.includes(store.get("prAgent")) ? store.get("prAgent") : agents[0];
    $("#prAgent").innerHTML = agents.map((a) => `<option${a === agent ? " selected" : ""}>${esc(a)}</option>`).join("");
    const brand = $("#prBrand").value || "";
    $("#prBrand").innerHTML = `<option value="">All</option>` + brands.map((b) => `<option value="${esc(b.id)}"${b.id === brand ? " selected" : ""}>${esc(b.name || b.id)}${b.usable ? "" : " (off)"}</option>`).join("");
    const research = isResearch(prMode);
    $("#prResearch").hidden = !research; $("#prResearch").style.display = research ? "contents" : "none";
    $("#prMake").hidden = research; $("#prMake").style.display = research ? "none" : "contents";
    // Sources: the brand's enabled research sources (social.json); none ticked = all of them.
    const b = brands.find((x) => x.id === brand);
    const ticked = new Set($$("#prSrc input:checked").map((x) => x.value));
    $("#prSrc").innerHTML = b ? (arr(b.sources).map((s) => `<label><input type="checkbox" value="${esc(s)}"${ticked.has(s) ? " checked" : ""}>${esc(s)}</label>`).join("") || `<div class="meta" style="padding:4px 10px">No enabled sources.</div>`)
      : `<div class="meta" style="padding:4px 10px">Pick a brand to choose sources.</div>`;
    for (const c of $$("#prSrc input")) c.onchange = () => { srcLabel(); regenerate(); };
    srcLabel();
    // Posts: the brand's cadence (posts per week) as the default; empty = the tool's default.
    $("#prCount").placeholder = b?.posts_per_week ? String(b.posts_per_week) : "cadence";
    $("#prCount").title = b?.posts_per_week ? `Brand cadence: ${b.posts_per_week} per week` : "Empty = each brand's cadence";
    prKey = `prEdit2:${prMode}|${agent}`;
    const p = prompts.find((x) => x.mode === prMode && x.agent === agent);
    prBase = p ? p.text : "";
    const saved = store.get(prKey);
    $("#prText").value = saved || buildPrompt();
    setEditing(false);
    fitPrompt();
  }
  function srcLabel() {
    const on = $$("#prSrc input:checked").map((x) => x.value);
    $("#prSrcSum").textContent = on.length ? on.join(", ") : "All";
  }
  // This run's options as short lines (only those set); the steps themselves are in RUNBOOK.md.
  function options() {
    const lines = [], brand = $("#prBrand").value;
    if (isResearch(prMode)) {
      const src = $$("#prSrc input:checked").map((x) => x.value), since = $("#prSince").value, max = parseInt($("#prMax").value, 10), kind = $("#prKind").value;
      if (src.length) lines.push(`sources ${src.join(", ")} (--source ${src.join(",")})`);
      if (since) lines.push(`posts since ${since} (--since ${since})`);
      if (max > 0) lines.push(`at most ${max} posts per source (--max-posts ${max})`);
      if (kind === "backfill") lines.push("backfill older posts (--backfill)");
      if (kind === "full") lines.push("full rescan (--full)");
    } else {
      const count = parseInt($("#prCount").value, 10);
      const def = arr(promptData.brands).find((x) => x.id === brand)?.posts_per_week;
      if (count > 0 && count !== def) lines.push(`${count} posts (ideas.mjs init --count ${count})`);
    }
    return lines.length ? lines.join("; ") : "defaults";
  }
  function buildPrompt() {
    if (!prBase) return "No prompt in docs/scheduled-prompt.md.";
    return prBase.replace(/\{\{TOOL\}\}/g, promptData.tool_root || "the social-autopilot folder").replace(/\{\{BRAND\}\}/g, $("#prBrand").value || promptData.all_brands || "all usable brands").replace(/\{\{OPTIONS\}\}/g, options());
  }
  // The box is as tall as the window allows (flex) and never shorter than its text when there is room.
  function fitPrompt() { const t = $("#prText"); t.style.height = ""; }
  function setEditing(on) {
    $("#prText").readOnly = !on;
    $("#prEdit").textContent = on ? "Done" : "Edit";
    $("#prEdit").setAttribute("aria-pressed", String(on));
    if (on) $("#prText").focus();
  }
  // An option changed: the prompt is rebuilt (an earlier hand edit of this mode x agent is dropped).
  function regenerate() { store.set(prKey, ""); $("#prText").value = buildPrompt(); setEditing(false); }
  const loadPrompts = safely("#prMsg", async () => {
    const r = await getJson("/api/prompts").catch(() => offline);
    if (r.error) { $("#prText").value = r.error; return; }
    if (!Array.isArray(r.prompts)) throw new Error("prompts missing");
    promptData = r;
    hint = baseHint.replace("the tool folder", r.tool_root || "the tool folder"); $("#prMsg").textContent = hint;
    drawPrompt();
  });
  $("#prAgent").onchange = () => { store.set("prAgent", $("#prAgent").value); drawPrompt(); };
  $("#prBrand").onchange = () => { drawPrompt(); regenerate(); };
  for (const id of ["#prSince", "#prMax", "#prKind", "#prCount"]) $(id).onchange = regenerate;
  $("#prText").oninput = () => store.set(prKey, $("#prText").value);
  $("#prEdit").onclick = () => setEditing($("#prText").readOnly);
  document.addEventListener("click", (e) => { if ($("#prSrcBox").open && !e.target.closest("#prSrcBox")) $("#prSrcBox").open = false; });
  const baseHint = $("#prMsg").textContent;
  let hint = baseHint;
  const flash = (t) => { $("#prMsg").textContent = t; setTimeout(() => { $("#prMsg").textContent = hint; }, 1800); };
  $("#prReset").onclick = () => { regenerate(); flash("Reset."); };
  $("#prCopy").onclick = async () => {
    try { await navigator.clipboard.writeText($("#prText").value); } catch { $("#prText").select(); document.execCommand("copy"); }
    flash("Copied.");
  };

  // ----- Posts: image(s), automatic checks, hosted image, Metricool; optional "Drop" before written -----
  const STATUS_TEXT = { ready: "Needs review", approved: "Approved", check_failed: "Failed checks", rejected: "Dropped", needs_prompt: "Making", needs_caption: "Making", generating: "Making", image_failed: "Image failed", preparing: "Making" };
  const STATUS_COLOR = { ready: "c-amber", approved: "c-green", rejected: "", image_failed: "c-red", check_failed: "c-red" };
  const MC = (d) => d.brand_post?.metricool;
  // What the user sees: To review (passed checks, waiting for Approve/Drop), Queued (approved: waiting for the next run
  // or scheduled in Metricool), Posted (published). Failed posts stay in their state with a red dot and a short reason;
  // drafts still being made and dropped posts are not shown (only "N in progress").
  const failedOf = (d) => (["check_failed", "image_failed"].includes(d.status) ? (arr(d.problems)[0] || d.error || "Failed checks") : MC(d) === "error" ? "Metricool error" : d.brand_post?.host_error ? "Image not hosted" : "");
  const stateOf = (d) => {
    if (d.status === "rejected") return "";
    if (d.brand_post) return MC(d) === "published" ? "posted" : "queued";
    if (d.status === "ready" || ["check_failed", "image_failed"].includes(d.status)) return "review";
    return "";
  };
  const STATES = [["review", "To review"], ["queued", "Queued"], ["posted", "Posted"]];
  // A short title: POST-xx once saved, else the first caption line (or the idea), at most 40 characters.
  const titleOf = (d) => {
    if (d.brand_post?.post) return d.brand_post.post;
    const t = String(arr(arr(d.preview?.posts)[0]?.texts)[0]?.text || d.idea || d.brand || "").split(/\r?\n/).find((l) => l.trim()) || d.id;
    return t.length > 40 ? t.slice(0, 39).trimEnd() + "…" : t;
  };
  let drState = store.get("drState");
  const loadDrafts = safely("#draftList", async () => {
    const brand = store.get("drBrand");
    const r = await getJson(`/api/drafts?brand=${encodeURIComponent(brand || "")}`).catch(() => offline);
    if (r.error) { $("#draftList").innerHTML = errLine(r.error); return; }
    if (!arr(brandData.brands).length) { const b = await getJson("/api/brands").catch(() => ({})); if (b.brands) brandData = b; }
    $("#drBrand").innerHTML = `<option value="">All</option>` + arr(brandData.brands).map((b) => `<option value="${esc(b.id)}"${b.id === brand ? " selected" : ""}>${esc(b.brand || b.id)}</option>`).join("");
    const drafts = arr(r.drafts);
    const count = (k) => drafts.filter((d) => stateOf(d) === k).length;
    if (!STATES.some(([k]) => k === drState)) drState = count("review") ? "review" : "queued";
    $("#drState").innerHTML = STATES.map(([k, t]) => `<button class="btn" type="button" data-state="${k}" aria-pressed="${k === drState}">${t} (${count(k)})</button>`).join("");
    for (const b of $$("#drState button")) b.onclick = () => { drState = b.dataset.state; store.set("drState", drState); loadDrafts(); };
    const making = drafts.filter((d) => !stateOf(d) && d.status !== "rejected").length, failed = drafts.filter((d) => stateOf(d) && failedOf(d)).length;
    $("#drExtra").innerHTML = [failed ? `<span class="count-bad">${failed} failed</span>` : "", making ? `${making} in progress` : ""].filter(Boolean).join(" · ");
    const list = drafts.filter((d) => stateOf(d) === drState);
    drList = list;
    $("#draftList").innerHTML = list.length ? `<div class="refs">${list.map((d) => {
      const thumb = draftThumb(d), fail = failedOf(d), review = drState === "review" && !fail;
      const when = plannedOf(d);
      const meta = [esc(d.brand), fail ? `<span class="bad-text" title="${esc(fail)}">${esc(fail)}</span>` : drState === "queued" ? (when !== "-" ? esc(when) : "next run") : when !== "-" ? esc(when) : ""].filter(Boolean).join(" · ");
      return `<div class="card ref draft" data-id="${esc(d.id)}">
        ${thumb ? `<button class="thumb" type="button" title="Preview"><img loading="lazy" src="${img(thumb)}" alt=""></button>` : `<div class="none">No image yet</div>`}
        <div class="head">${fail ? `<span class="dot dot-red" title="${esc(fail)}"></span>` : ""}<span class="title" title="${esc(titleOf(d))}">${esc(titleOf(d))}</span>${review ? `<button class="btn primary" type="button" data-act="approve">Approve</button><button class="btn" type="button" data-act="drop">Drop</button>` : ""}</div>
        <div class="meta">${meta}</div>
        <div class="msg"></div>
      </div>`;
    }).join("")}</div>` : `<div class="meta">Nothing here.</div>`;
    const cards = $$("#draftList .draft");
    wireCards(cards, (i) => openPreview(list[i], { list, i }));
    cards.forEach((card, i) => {
      for (const btn of $$("[data-act]", card)) btn.onclick = async () => {
        const d = list[i], msg = $(".msg", card);
        if (btn.dataset.act === "drop" && !confirm("Drop this post? It will not be used.")) return;
        for (const b of $$("[data-act]", card)) b.disabled = true;
        if (btn.dataset.act === "approve") msg.innerHTML = `<span class="meta">Saving and hosting…</span>`;
        const res = btn.dataset.act === "approve" ? await postJson("/api/approve", { id: d.id }).catch(() => offline) : await postJson("/api/cancel", { id: d.id, note: "" }).catch(() => offline);
        if (res.error) { msg.innerHTML = errLine(res.error); for (const b of $$("[data-act]", card)) b.disabled = false; return; }
        loadDrafts();
      };
    });
  });
  let drList = [];
  const draftThumb = (d) => (d.image_exists ? d.image : arr(d.preview?.media).find((m) => m.type !== "video")?.path || "");
  // The card's ONE label: the latest step reached (Making → Needs review → Approved · waiting to send → Scheduled →
  // Published), Dropped, or Failed in red. A post recorded earlier as a Metricool draft (old) counts as approved and
  // waiting: the next Create & publish run sends it as a scheduled post.
  function stepOf(d) {
    const bp = d.brand_post, mc = bp?.metricool;
    if (d.status === "rejected") return ["Dropped", ""];
    if (["check_failed", "image_failed"].includes(d.status)) return ["Failed", "c-red"];
    if (mc === "error") return ["Failed (Metricool)", "c-red"];
    if (mc === "published") return ["Published", "c-green"];
    if (mc === "scheduled") return ["Scheduled", "c-green"];
    if (bp) return ["Approved · waiting to send", "c-amber"];
    if (d.status === "ready") return ["Needs review", "c-amber"];
    return ["Making", ""];
  }
  const stepTag = (d) => { const [t, c] = stepOf(d); return `<span class="status-tag ${c}">${esc(t)}</span>`; };
  // All steps (preview panel): checks, hosted image and Metricool once the post is written into the brand.
  function draftTags(d) {
    const bp = d.brand_post, tag = (t, c = "") => `<span class="status-tag ${c}">${esc(t)}</span>`;
    return tag(STATUS_TEXT[d.status] || d.status, STATUS_COLOR[d.status]) + (arr(d.problems).length ? tag(`${d.problems.length} check problems`, "c-red") : "")
      + (bp ? tag(bp.media_url ? "Image hosted" : "Image not hosted", bp.media_url ? "c-green" : "c-amber") + tag(MC_TEXT[bp.metricool] || bp.metricool || "-", MC_COLOR[bp.metricool]) : "")
      + (d.image_mode === "scene-swap" ? tag("scene-swap") : "");
  }
  // Planned time: what Metricool was given (metricool_sent publication), else nothing yet.
  const plannedOf = (d) => { const m = arr(d.brand_post?.metricool_sent).find((x) => x.publication); return m ? `${String(m.publication).slice(0, 16).replace("T", " ")}${m.draft ? " (old draft)" : ""}` : "-"; };
  // The post's media for the lightbox: its own images/videos, then the shop's original (scene-swap).
  function mediaOf(d) {
    const own = (arr(d.preview?.media).length ? d.preview.media : d.image_exists ? [{ type: "image", path: d.image }] : []).map((m, i, all) => ({ ...m, label: m.type === "video" ? "Video" : all.length > 1 ? `New image ${i + 1}/${all.length}` : "New image" }));
    return d.image_mode === "scene-swap" && d.reference_image ? [...own, { type: "image", path: d.reference_image, label: "Shop's original" }] : own;
  }

  // ----- Overlay: a near-fullscreen window (lightbox or Preview), always inside the app window -----
  const overlay = document.createElement("div");
  overlay.className = "lb";
  overlay.hidden = true;
  overlay.innerHTML = `<div class="lb-win" role="dialog" aria-modal="true"><div class="lb-head"><div class="lb-title"></div><span class="lb-extra"></span><button class="btn lb-close" type="button">✕ Close</button></div><div class="lb-body"></div></div>`;
  document.body.append(overlay);
  let lbKeys = null, lbItemKeys = null, lbOnClose = null;
  function closeOverlay() {
    overlay.hidden = true; for (const c of [".lb-title", ".lb-extra", ".lb-body"]) $(c, overlay).innerHTML = ""; lbKeys = lbItemKeys = null; document.body.style.overflow = "";
    const f = lbOnClose; lbOnClose = null; f?.();
  }
  // title: the header text; extra: header controls left of ✕ Close (channel tabs, ‹ Prev / Next ›); body: the window's
  // content; keys: ←/→ (images, channels); itemKeys: ↑/↓ (previous/next item of the list).
  function openOverlay(title, body, keys, extra = "", itemKeys = null) {
    $(".lb-title", overlay).innerHTML = title;
    $(".lb-extra", overlay).innerHTML = extra;
    $(".lb-body", overlay).innerHTML = body;
    lbKeys = keys || null;
    lbItemKeys = itemKeys || null;
    const wasHidden = overlay.hidden;
    overlay.hidden = false;
    document.body.style.overflow = "hidden";
    if (wasHidden) $(".lb-close", overlay).focus();
  }
  $(".lb-close", overlay).onclick = closeOverlay;
  overlay.addEventListener("click", (e) => { if (e.target === overlay || e.target.classList.contains("lb-stage")) closeOverlay(); });
  document.addEventListener("keydown", (e) => {
    if (overlay.hidden) return;
    if (e.key === "Escape") { closeOverlay(); return; }
    if (e.target.closest?.("input, textarea, select")) return;
    if (lbKeys && e.key === "ArrowLeft") lbKeys(-1);
    else if (lbKeys && e.key === "ArrowRight") lbKeys(1);
    else if (lbItemKeys && (e.key === "ArrowUp" || e.key === "ArrowDown")) { e.preventDefault(); lbItemKeys(e.key === "ArrowUp" ? -1 : 1); }
  });
  function openLightbox(items, start = 0) {
    if (!items.length) return;
    let i = Math.min(Math.max(0, start), items.length - 1);
    const draw = () => {
      const m = items[i];
      const media = m.type === "video" ? `<video src="${img(m.path)}" controls autoplay></video>` : `<img src="${img(m.path)}" alt="${esc(m.label)}">`;
      openOverlay(`${esc(m.label)}${items.length > 1 ? ` · ${i + 1}/${items.length}` : ""}`,
        `<div class="lb-stage">${items.length > 1 ? `<button class="btn lb-nav" type="button" data-step="-1" aria-label="Previous">‹</button>` : ""}${media}${items.length > 1 ? `<button class="btn lb-nav" type="button" data-step="1" aria-label="Next">›</button>` : ""}</div>`,
        (step) => { i = (i + step + items.length) % items.length; draw(); });
      for (const b of $$(".lb-nav", overlay)) b.onclick = (e) => { e.stopPropagation(); lbKeys(Number(b.dataset.step)); };
    };
    draw();
  }

  // Preview: how the post would look on each enabled channel (Facebook feed card, Instagram post), from the server's
  // preview data. ONE language at a time: the posted language first (EN), the reviewer-only reading (VN) on the switch.
  const LANG_NAME = (l) => String(l || "").split("+").map((x) => x.toUpperCase()).join(" + ");
  // Facebook-like "… See more": past 5 lines or ~250 characters the text is cut; the rest opens in place.
  const linkify = (t) => esc(t).replace(/(https?:\/\/[^\s<]+)|(^|\s)(#[\p{L}\p{N}_]+)/gu, (m, url, sp, tag) => (url ? `<a href="${url}" target="_blank" rel="noopener">${url}</a>` : `${sp}<span class="tag">${tag}</span>`));
  function postText(text) {
    const t = String(text || "");
    let cut = t.length > 250 ? t.lastIndexOf(" ", 250) : -1;
    const nl = t.split("\n").slice(0, 5).join("\n").length;
    if (nl < t.length && (cut < 0 || nl < cut)) cut = nl;
    if (cut <= 0 || cut >= t.length) return linkify(t);
    return `<span class="rest">${linkify(t)} <button class="more" type="button" data-fold="1">See less</button></span><span class="cut" hidden>${linkify(t.slice(0, cut).trimEnd())}… <button class="more" type="button" data-fold="0">See more</button></span>`;
  }
  overlay.addEventListener("click", (e) => {
    const b = e.target.closest(".pv .more");
    if (!b) return;
    const t = b.closest(".txt"), fold = b.dataset.fold === "1";
    $(".rest", t).hidden = fold; $(".cut", t).hidden = !fold;
  });
  // nav: { list, i } when opened from the list: ‹ Prev / Next › (↑/↓) walk it without closing.
  function openPreview(d, nav = null) {
    const go = nav ? (step) => { const j = nav.i + step; if (nav.list[j]) openPreview(nav.list[j], { list: nav.list, i: j }); } : null;
    const bp = d.brand_post, canCancel = !bp && d.status !== "rejected", swap = d.image_mode === "scene-swap";
    const p = d.preview || { posts: [], media: [] };
    const initial = esc(String(p.page_name || "?").trim().charAt(0).toUpperCase());
    const media = () => {
      const m = arr(p.media).slice(0, 4);
      if (!m.length) return `<div class="video" style="aspect-ratio:1/1;background:#e4e6eb"></div>`;
      return `<div class="media n${m.length}">${m.map((x, i) => (x.type === "video" ? `<div class="video" data-pv="${i}"></div>` : `<img src="${img(x.path)}" alt="" data-pv="${i}">`)).join("")}</div>`;
    };
    const NET = { facebook: "Facebook", instagram: "Instagram" };
    const tag = (post, o) => `<div class="pv-tag">${esc(NET[post.network] || post.network)}${o.lang ? ` · ${esc(LANG_NAME(o.lang))}` : ""}${o.review ? ` · <span class="pv-ro">Review only, not posted</span>` : ""}</div>`;
    const empty = "(no caption yet)";
    const fb = (post, o) => `<div class="pv fb${o.review ? " review" : ""}">${tag(post, o)}
      <div class="pv-head"><div class="av">${initial}</div><div class="who"><b>${esc(p.page_name)}</b><span>Just now · Public</span></div></div>
      <div class="txt">${postText(o.text || empty)}</div>${media()}<div class="bar"><span>Like</span><span>Comment</span><span>Share</span></div></div>`;
    const ig = (post, o) => `<div class="pv ig${o.review ? " review" : ""}">${tag(post, o)}
      <div class="pv-head"><div class="av">${initial}</div><div class="who"><b>${esc(post.account || p.page_name)}</b></div></div>
      ${media()}<div class="txt"><b>${esc(post.account || p.page_name)}</b> ${postText(o.text || empty)}</div></div>`;
    const card = (post, o) => (post.network === "instagram" ? ig(post, o) : post.network === "facebook" ? fb(post, o)
      : `<div class="pv">${tag(post, o)}<div class="txt">${esc(o.text)}</div></div>`);
    // Reviewer-only texts (never posted). Accepts [{lang,text}], {lang:text} or a plain string.
    const rv = p.review_texts;
    const review = (Array.isArray(rv) ? rv : rv && typeof rv === "object" ? Object.entries(rv).map(([lang, text]) => ({ lang, text })) : rv ? [{ lang: "", text: rv }] : [])
      .map((x) => (typeof x === "string" ? { lang: "", text: x } : x)).filter((x) => x && x.text).map((x) => ({ ...x, review: true }));
    const posts = arr(p.posts);
    const optionsOf = (post) => [...[...arr(post?.texts)].sort((a, b) => (b.lang === "en") - (a.lang === "en")), ...review];
    const side = (post, o) => `<dl class="kv">
        <dt>Brand</dt><dd>${esc(p.page_name || d.brand)}</dd>
        <dt>Channels</dt><dd>${posts.map((x) => `${esc(NET[x.network] || x.network)}${x.account ? ` <span class="meta">${esc(x.account)}</span>` : ""}`).join("<br>") || "-"}</dd>
        <dt>Posted language</dt><dd>${esc(LANG_NAME((post?.langs || arr(post?.texts).map((t) => t.lang) || arr(d.languages)).join("+")) || "-")}</dd>
        ${review.length ? `<dt>Review only</dt><dd>${esc(review.map((x) => LANG_NAME(x.lang)).join(", "))} <span class="meta">(not posted)</span></dd>` : ""}
        <dt>Viewing</dt><dd>${o ? `${esc(LANG_NAME(o.lang) || "-")} · ${o.review ? `<span class="warn-text">Review only, not posted</span>` : `<span class="ok-text">Posted</span>`}` : "-"}</dd>
        <dt>Status</dt><dd>${draftTags(d)}</dd>
        <dt>Time</dt><dd>${esc(plannedOf(d))}</dd>
      </dl>
      ${bp ? hostBlock(d) + mcBlock(bp) : ""}
      ${arr(d.problems).length ? `<ul class="missing">${d.problems.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${d.error ? `<div>${errLine(d.error)}</div>` : ""}
      ${d.status === "rejected" ? `<div class="bad-text">Dropped${d.note ? `: ${esc(d.note)}` : ""}</div>` : ""}
      <div class="meta">${d.inspiration_url ? `<a href="${esc(d.inspiration_url)}" target="_blank" rel="noopener">Reference post</a> · ` : ""}${d.metadata_clean ? `metadata removed${d.metadata_clean.pixels_identical ? "" : " (pixels CHANGED)"}` : "metadata not cleaned"}${d.watermark ? ` · watermark ${esc(d.watermark.position)}` : ""}${swap ? ` · ${d.logo_check ? "logo-free confirmed" : "logo-free not confirmed"}` : ""}</div>
      ${swap && d.reference_image ? `<div class="row-actions"><button class="btn" type="button" data-orig>Shop's original</button></div>` : ""}
      ${canCancel ? `<div class="row-actions">${d.status === "ready" ? `<button class="btn primary" type="button" data-act="approve" title="Save to the brand and host the image; the next Create &amp; publish run schedules it in Metricool">Approve</button>` : ""}<button class="btn" type="button" data-act="cancel" title="Only before the post is approved">Drop</button></div>
        <div class="reject-box" hidden><input class="note" placeholder="Reason (optional)"><button class="btn" type="button" data-act="cancel-go">Confirm drop</button></div>` : ""}
      <div class="msg"></div>`;
    const title = `Preview ${esc(bp?.post || "")} <span class="meta">(mock${bp?.metricool === "published" ? "" : ", not posted"})</span>`;
    let lang = null; // the chosen language, kept when switching channel
    const keyOf = (o) => `${o.review ? "r" : "p"}:${o.lang}`;
    const draw = (k) => {
      const post = posts[k];
      const opts = optionsOf(post);
      const o = opts.find((x) => keyOf(x) === lang) || opts[0] || null;
      if (o) lang = keyOf(o);
      const chan = posts.length > 1 ? `<nav class="tabs">${posts.map((x, j) => `<button type="button" data-tab="${j}" aria-pressed="${j === k}">${esc(NET[x.network] || x.network)}</button>`).join("")}</nav>` : "";
      const langBar = opts.length > 1 ? `<nav class="tabs pv-langs" aria-label="Language">${opts.map((x, j) => `<button type="button" data-lang="${j}" aria-pressed="${x === o}">${esc(LANG_NAME(x.lang) || "?")} <span class="meta">${x.review ? "Review only" : "Posted"}</span></button>`).join("")}</nav>` : "";
      openOverlay(title, `<div class="pv-layout"><div class="pv-stage"><div class="pv-col">${langBar}${post && o ? card(post, o) : `<div class="meta">No channel enabled.</div>`}</div></div><div class="pv-side">${side(post, o)}</div></div>`,
        posts.length > 1 ? (step) => draw((k + step + posts.length) % posts.length) : null, chan + (nav ? itemNav(nav.i, nav.list.length) : ""), go);
      if (nav) lbOnClose = () => focusCard("#draftList .draft", d.id);
      for (const b of $$("[data-item]", overlay)) b.onclick = () => go(Number(b.dataset.item));
      const sideBox = $(".pv-side", overlay);
      for (const b of $$("[data-act]", sideBox)) b.onclick = () => cancelDraft(sideBox, d, b.dataset.act, nav);
      if ($("[data-orig]", sideBox)) $("[data-orig]", sideBox).onclick = () => big(mediaOf(d).length - 1);
      for (const b of $$("[data-tab]", overlay)) b.onclick = () => draw(Number(b.dataset.tab));
      for (const b of $$("[data-lang]", overlay)) b.onclick = () => { lang = keyOf(opts[Number(b.dataset.lang)]); draw(k); };
      const box = $(".pv-stage", overlay);
      for (const m of $$("[data-pv]", box)) m.onclick = () => big(Number(m.dataset.pv));
    };
    const big = (start) => { openLightbox(mediaOf(d), start); lbOnClose = () => openPreview(d, nav); };
    draw(0);
  }
  // Hosted image (hosting runs automatically after the post is written into the brand): Copy image link, no raw URL.
  function hostBlock(d) {
    const bp = d.brand_post, u = [].concat(bp?.media_url || [])[0];
    if (u) return `<div class="host"><span class="ok-text">Image hosted</span><button class="btn copy-link" type="button" data-copy="${esc(u)}" title="${esc(u)}">Copy image link</button></div>`;
    return `<div class="host"><span class="muted">No image link yet</span>${bp?.host_error ? errLine(bp.host_error) : ""}</div>`;
  }
  // Metricool: what metricool-mcp.mjs record wrote (draft or scheduled, time, planner link).
  function mcBlock(bp) {
    if (!arr(bp.metricool_sent).length) return "";
    const old = arr(bp.metricool_sent).filter((m) => m.draft);
    if (old.length && old.length === bp.metricool_sent.length) return `<div class="host meta">Old Metricool draft ${old.map((m) => esc(m.id || "")).join(", ")} (delete it in Metricool); the next run sends this post as a scheduled post.</div>`;
    return `<div class="host">${bp.metricool_sent.map((m) => `<span class="muted">${esc(m.network)}:</span> ${m.draft ? "old draft" : "scheduled"} ${esc(String(m.publication || "").slice(0, 16).replace("T", " "))}${m.planner_url ? ` <a href="${esc(m.planner_url)}" target="_blank" rel="noopener">Open in Metricool</a>` : ""}`).join(" · ")}</div>`;
  }
  document.addEventListener("click", async (e) => {
    const b = e.target.closest(".copy-link");
    if (!b) return;
    const t = b.textContent;
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; setTimeout(() => { b.textContent = t; }, 1500); } catch {}
  });
  // Optional "Drop" of a post before it is written into the brand (finalize.mjs cancel); nothing waits for it.
  async function cancelDraft(panel, d, act, nav) {
    const msg = $(".msg", panel), box = $(".reject-box", panel);
    if (act === "cancel") { box.hidden = !box.hidden; if (!box.hidden) $(".note", panel).focus(); return; }
    for (const b of $$("[data-act]", panel)) b.disabled = true;
    if (act === "approve") msg.innerHTML = `<span class="meta">Saving to the brand and hosting the image…</span>`;
    const r = act === "approve" ? await postJson("/api/approve", { id: d.id }).catch(() => offline)
      : await postJson("/api/cancel", { id: d.id, note: $(".note", panel)?.value.trim() || "" }).catch(() => offline);
    if (r.error) { msg.innerHTML = errLine(r.error); for (const b of $$("[data-act]", panel)) b.disabled = false; return; }
    await loadDrafts();
    if (!nav) return;
    const j = drList.findIndex((x) => x.id === d.id), at = j >= 0 ? j : Math.min(nav?.i || 0, drList.length - 1);
    if (at >= 0) openPreview(drList[at], { list: drList, i: at }); else closeOverlay();
  }
  $("#drBrand").onchange = () => { store.set("drBrand", $("#drBrand").value); loadDrafts(); };

  // ----- Settings: Accounts (who is signed in: names only), Requirements (installed tools), then tool settings -----
  const dotRow = (ok, label, value, action = "") => `<dt>${esc(label)}</dt><dd><span class="dot ${ok === null ? "dot-grey" : ok ? "dot-green" : "dot-red"}"></span>${value}${action}</dd>`;
  const loadAccounts = safely("#setAccounts", async () => {
    $("#setAccounts").innerHTML = `<dt>Codex (ChatGPT)</dt><dd class="meta">Checking…</dd>`;
    const a = await getJson("/api/accounts").catch(() => offline);
    if (a.error) { $("#setAccounts").innerHTML = `<dt>Accounts</dt><dd>${errLine(a.error)}</dd>`; return; }
    if (!a.codex || !Array.isArray(a.requirements)) throw new Error("accounts missing");
    const c = a.codex, g = a.github || {}, m = a.metricool || {};
    const who = [c.email, c.name && c.name.trim() !== c.email ? c.name.trim() : "", c.plan ? `plan ${c.plan}` : ""].filter(Boolean).map(esc).join(" · ");
    $("#setAccounts").innerHTML =
      dotRow(c.signed_in, "Codex (ChatGPT)", c.signed_in ? who || "Signed in" : c.installed ? "Not signed in" : "Install Codex CLI first",
        c.installed ? `<button class="btn${c.signed_in ? "" : " primary"}" type="button" id="setLogin">${c.signed_in ? "Switch account" : "Sign in"}</button>` : "")
      + dotRow(g.signed_in, "GitHub (image host)", g.signed_in ? esc(g.login) : g.installed ? "Not signed in (gh auth login)" : "gh CLI not installed")
      + dotRow(m.user_id ? true : null, "Metricool", `${m.user_id ? `account ${esc(m.user_id)} · ` : ""}${arr(m.brands).length} brands <span class="meta">via the Claude/ChatGPT connector</span>`);
    $("#setReqs").innerHTML = a.requirements.map((r) => dotRow(r.ok, r.name, r.ok ? `v${esc(r.version || "?")}` : "Not installed",
      r.action === "install" ? `<button class="btn primary" type="button" data-install>Install</button>` : "")).join("");
    if ($("#setLogin")) $("#setLogin").onclick = () => setupStep("login");
    for (const b of $$("#setReqs [data-install]")) b.onclick = () => setupStep("install");
  });
  // Codex sign-in or install, through core/setup/config-api.mjs. Sign-in opens ChatGPT's page in Chrome and shows the
  // one-time code to type there.
  let loginTimer = 0;
  async function setupStep(step) {
    const msg = $("#setLoginMsg");
    for (const b of $$("#page-settings fieldset .btn")) b.disabled = true;
    msg.innerHTML = `<span class="meta">${step === "login" ? "Opening the ChatGPT sign-in page in Chrome…" : "Installing Codex CLI…"}</span>`;
    if (step === "login") loginTimer = setInterval(async () => {
      const { code } = await getJson("/api/setup-login").catch(() => ({}));
      if (!code || msg.dataset.code === code) return;
      msg.dataset.code = code;
      msg.innerHTML = `Sign-in code: <b>${esc(code)}</b> <button class="btn copy-link" type="button" data-copy="${esc(code)}">Copy code</button> <span class="meta">Type it on the page opened in Chrome (sign in with the ChatGPT account to use).</span>`;
    }, 1000);
    const r = await postJson("/api/setup-step", { step }).catch(() => offline);
    clearInterval(loginTimer); delete msg.dataset.code;
    for (const b of $$("#page-settings fieldset .btn")) b.disabled = false;
    if (r.superseded) return;
    msg.innerHTML = r.error ? errLine(r.error) : `<span class="ok-text">${step === "login" ? "Signed in." : "Installed."}</span>`;
    loadAccounts();
  }
  $("#setRecheck").onclick = () => loadAccounts();
  const loadSettings = safely("#settingsView", async () => {
    loadAccounts();
    const [r, mb] = await Promise.all([getJson("/api/settings"), getJson("/api/metricool-brands")]).catch(() => [offline, {}]);
    if (r.error) { $("#settingsMsg").innerHTML = errLine(r.error); return; }
    const s = r.settings || {}, rs = s.research || {}, dd = rs.dedupe || {}, delay = arr(rs.delay_seconds), cx = s.codex || {};
    const row = (k, v, tip = "") => `<dt title="${esc(tip || k)}">${esc(k)}</dt><dd>${v}</dd>`;
    $("#settingsView").innerHTML = `<dl class="kv">
      ${row("Metricool", "Scheduled at each brand's slot time", "The tool always schedules real posts (no drafts)")}
      ${s.imageHost ? row("Auto-host images", s.imageHost.auto_after_writeback !== false ? "Yes" : "No", "Push the image to the image repo right after the post is written into the brand") : ""}
      ${row("Metricool brands", `${arr(mb.brands).filter((b) => !b.removed).length}${mb.updated_at ? ` <span class="meta">updated ${esc(String(mb.updated_at).slice(0, 16).replace("T", " "))}</span>` : ` <span class="meta">loaded on the next Create &amp; publish run</span>`}`)}</dl>`;
    const num = (k, v, label, tip = "") => `<div><label title="${esc(tip || label)}">${esc(label)}</label><input type="number" min="0" step="1" data-s="${k}" value="${esc(v)}"></div>`;
    const text = (k, v, label, tip) => `<div class="wide"><label title="${esc(tip)}">${esc(label)}</label><input data-s="${k}" value="${esc(v)}" title="${esc(tip)}"></div>`;
    $("#settingsForm").innerHTML = `<div class="set-grid">
      ${s.imageHost ? `<div><label class="check" title="Push the image right after the post is written into the brand"><input type="checkbox" data-s="imageHost.auto_after_writeback"${s.imageHost.auto_after_writeback !== false ? " checked" : ""}> Auto-host images</label></div>` : ""}
      </div>
      <details><summary>Advanced</summary>
        <div class="set-grid">
        ${num("research.delay_seconds.0", delay[0] ?? 5, "Min pause (s)", "Random pause between page actions while researching")}
        ${num("research.delay_seconds.1", delay[1] ?? 15, "Max pause (s)")}
        ${num("codex.timeout_minutes", cx.timeout_minutes ?? 15, "Codex wait (min)")}
        <div><label title="Duplicates never enter the library (view only; edit in workspace/settings.json)">Dedupe</label><input disabled value="image ≤${esc(dd.image_distance ?? 20)}/256 · caption ≥${Math.round((dd.caption_similarity ?? 0.9) * 100)}%"></div>
        ${text("skillsRoot", s.skillsRoot || "", "Skills folder", `Folder of brand skill folders (brands linked by path on Overview work too). Now: ${r.skillsRootResolved || ""}`)}
        <div><label title="Command that runs Codex">Codex command</label><input data-s="codex.command" value="${esc(cx.command || "codex")}"></div>
        <div><label title="Used for watermarks and reading WebP when deduping">ffmpeg command</label><input data-s="ffmpeg.command" value="${esc(s.ffmpeg?.command || "ffmpeg")}"></div>
        ${text("remove_watermark.script", s.remove_watermark?.script || "", "Metadata script", "Image metadata cleaner (remove-watermark-skill)")}
        ${s.imageHost ? text("imageHost.path", s.imageHost.path || "", "Image repo", "Image repo folder (imageHost.path)") + text("imageHost.rawBase", s.imageHost.rawBase || "", "Public link base", "Public link base of the images (imageHost.rawBase, https)") : ""}
        </div></details>`;
  });
  $("#settingsEdit").onclick = () => { const o = $("#settingsEditor"); o.hidden = !o.hidden; $("#settingsEdit").textContent = o.hidden ? "Edit" : "Close"; };
  $("#settingsSave").onclick = async () => {
    const out = { research: { delay_seconds: [] }, metricool: {}, codex: {}, ffmpeg: {}, remove_watermark: {}, imageHost: {} };
    for (const el of $$("#settingsForm [data-s]")) {
      const parts = el.dataset.s.split(".");
      const v = el.type === "checkbox" ? el.checked : el.type === "number" ? Number(el.value) : el.value;
      let o = out; for (const p of parts.slice(0, -1)) o = o[p] ||= {};
      o[parts.at(-1)] = v;
    }
    const r = await postJson("/api/settings", { settings: out }).catch(() => offline);
    const err = r.error;
    $("#settingsMsg").innerHTML = err ? errLine(err) : `<span class="ok-text">Saved.</span>`;
    if (!err) { $("#settingsEditor").hidden = true; $("#settingsEdit").textContent = "Edit"; loadSettings(); }
  };

  show(store.get("page") || "overview");
  // No reload button per tab: a tab reloads when opened and when a filter changes, and every 45 s while it is visible,
  // except while the preview is open, the window is hidden or something is being typed.
  setInterval(() => {
    if (document.hidden || !overlay.hidden || document.activeElement?.matches?.("input, textarea, select")) return;
    if ($$("#resBody .reject-box, #draftList .reject-box").some((b) => !b.hidden)) return;
    if ($$("#ovList [data-panel]").some((p) => !p.hidden)) return;
    if (!$("#page-overview").hidden) loadOverview();
    else if (!$("#page-store").hidden) loadResearch();
    else if (!$("#page-posts").hidden) loadDrafts();
  }, 45000);
})();
</script>
</body>
</html>
