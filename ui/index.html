<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Autopilot</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/core/assets/tool.css">
<script src="/core/assets/hub.js" defer></script>
<style>
/* Thin management layer over scripts/: every value shown or saved goes through the same functions the scheduled agent
   runs. Text weight 400 everywhere; states by border colour only, no shadows. Controls (inputs, selects, buttons, tabs)
   all take the one size defined in core/assets/tool.css (--ctl-h, --ctl-pad, --ctl-border, --ctl-font). */
* { font-weight: 400; }
b, strong, h1, h2, h3, th { font-weight: 400; }
a { color: #0b57d0; }
.page[hidden] { display: none; }
nav.tabs { display: flex; margin: 0 0 12px; }
nav.tabs button { height: var(--ctl-h); padding: var(--ctl-pad); font: inherit; font-size: var(--ctl-font); background: #e1e1e1; border: var(--ctl-border); margin-right: -1px; cursor: default; }
nav.tabs button:hover { border-color: #0078d7; position: relative; }
nav.tabs button[aria-pressed="true"] { background: #fff; border-color: var(--accent); position: relative; }
.cards { display: grid; gap: 10px; }
.card { background: #fff; border: 1px solid var(--line); padding: 10px 12px; }
.card.ok { border-color: var(--accent); }
.card.todo { border-color: #b06000; }
.card h3 { margin: 0 0 4px; font-size: 15px; }
.meta { color: var(--muted); font-size: 12px; }
.muted { color: var(--muted); }
.missing { margin: 4px 0 0; padding-left: 18px; color: #b06000; font-size: 12px; }
.ok-text { color: #006400; } .bad-text { color: rgb(176, 0, 0); } .warn-text { color: #b06000; }
.status-tag { display: inline-block; padding: 1px 8px; border: 1px solid var(--line); font-size: 12px; }
.status-tag.c-green { border-color: var(--accent); } .status-tag.c-amber { border-color: #b06000; } .status-tag.c-red { border-color: rgb(176, 0, 0); }
.card .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.picker { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.picker .find-row { display: flex; gap: 8px; margin: 0 0 6px; } .picker .find-row input { flex: 1 1 auto; min-width: 0; }
.picker .found label { display: flex; gap: 6px; align-items: center; margin: 0; padding: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle; } .dot-green { background: #1f8f3a; } .dot-red { background: rgb(176, 0, 0); }
.row-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
/* Toolbar: label and control on one line. */
.toolbar { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar > div { display: flex; align-items: center; gap: 8px; }
.toolbar label { margin: 0; white-space: nowrap; }
.toolbar select, .toolbar input { width: auto; min-width: 160px; }
fieldset { border: 1px solid var(--line); background: #fff; padding: 10px 12px; margin: 0 0 12px; min-width: 0; }
legend { padding: 0 4px; color: var(--ink); }
table.edit { width: 100%; border-collapse: collapse; }
table.edit th { text-align: left; color: var(--muted); font-size: 12px; padding: 4px; }
table.edit td { padding: 3px 4px; vertical-align: middle; }
.table-wrap { overflow-x: auto; }
.inline { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.inline label { display: flex; gap: 6px; align-items: center; margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 12px; }
.msg { white-space: pre-wrap; }
.msg:empty { display: none; }
textarea.prompt { min-height: 260px; font: 12.5px/1.5 Consolas, ui-monospace, monospace; }
details > summary { cursor: default; color: var(--muted); font-size: 12px; }
details[open] > summary { margin-bottom: 6px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.slot { display: flex; gap: 6px; margin-bottom: 4px; align-items: center; }
.slot select, .slot input { width: auto; }
.slot input[type=text], .src-url { flex: 1 1 auto; min-width: 0; }
.card .head-row { display: flex; align-items: center; gap: 8px; } .card .head-row h3 { flex: 1 1 auto; margin: 0 0 4px; }
#prText { width: 100%; }
/* Prompt run options: one compact row; Nguồn is a dropdown of checkboxes. */
.pr-opts input[type=number] { min-width: 0; width: 130px; } .pr-opts input[type=date] { min-width: 0; width: 150px; }
.pr-src { position: relative; }
.pr-src > summary { list-style: none; min-width: 160px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; justify-content: flex-start; color: var(--ink); font-size: var(--ctl-font); }
.pr-src > summary::-webkit-details-marker { display: none; }
details.pr-src[open] > summary { margin-bottom: 0; }
.pr-src-list { position: absolute; z-index: 5; top: calc(var(--ctl-h) - 1px); left: 0; min-width: 220px; max-height: 260px; overflow: auto; background: #fff; border: 1px solid #8a8a8a; padding: 4px 0; }
.pr-src-list label { display: flex; gap: 8px; align-items: center; margin: 0; padding: 4px 10px; white-space: nowrap; }
.pr-src-list label:hover { background: var(--hover); }
pre { white-space: pre-wrap; word-break: break-word; font: 12.5px/1.45 var(--font); margin: 4px 0 0; max-height: 220px; overflow: auto; }
/* Nghiên cứu */
.refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.ref img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: var(--control); display: block; border: 1px solid var(--line); }
.ref { display: grid; gap: 4px; align-content: start; }
.ref .thumb { position: relative; }
.ref .count { position: absolute; right: 4px; bottom: 4px; background: #fff; border: 1px solid var(--line); padding: 0 6px; font-size: 12px; }
.ref .head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ref .head .acts { margin-left: auto; }
.ref .none { aspect-ratio: 1 / 1; display: grid; place-items: center; border: 1px dashed var(--line); color: var(--muted); font-size: 12px; }
.ref .line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref .head .status-tag + .status-tag { margin-left: -2px; }
/* A click on a card (not on its buttons, links or Caption) opens it in the overlay; Enter too. */
.card.open-card { cursor: pointer; }
.card.open-card:hover { border-color: #0078d7; }
.card.open-card:focus { outline: 1px solid #0078d7; outline-offset: -1px; }
.host { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12.5px; }
.host a { overflow-wrap: anywhere; }
.reject-box { display: flex; gap: 6px; align-items: center; } .reject-box input { flex: 1 1 auto; min-width: 0; width: auto; }
/* Xem trước: static mocks of a Facebook feed post and an Instagram post (no external calls). */
.pv { width: 360px; max-width: 100%; background: #fff; border: 1px solid #dadde1; border-radius: 8px; font: 14px/1.34 "Segoe UI", Helvetica, Arial, sans-serif; color: #050505; overflow: hidden; }
.pv .pv-tag { font-size: 11px; color: #65676b; padding: 6px 12px 0; }
.pv .pv-head { display: flex; gap: 8px; align-items: center; padding: 8px 12px; }
.pv .av { width: 36px; height: 36px; border-radius: 50%; background: #1b74e4; color: #fff; display: grid; place-items: center; font-size: 15px; flex: 0 0 auto; }
.pv .who { display: grid; } .pv .who b { font-size: 14px; } .pv .who span { font-size: 12px; color: #65676b; }
.pv .txt { padding: 0 12px 10px; white-space: pre-wrap; word-break: break-word; }
.pv .more { display: inline; padding: 0; color: #65676b; background: none; border: 0; font: inherit; cursor: pointer; }
.pv .more:hover { text-decoration: underline; }
.pv .pv-ro { color: #b06000; }
.pv.review { border-color: #b06000; }
.pv .media { display: grid; gap: 2px; background: #fff; }
.pv .media.n2 { grid-template-columns: 1fr 1fr; } .pv .media.n3, .pv .media.n4 { grid-template-columns: 1fr 1fr; }
.pv .media img { width: 100%; display: block; object-fit: cover; }
.pv .media.n1 img { aspect-ratio: auto; max-height: 420px; } .pv .media:not(.n1) img { aspect-ratio: 1 / 1; }
.pv .video { aspect-ratio: 16 / 9; background: #18191a; display: grid; place-items: center; }
.pv .video::after { content: ""; border-left: 22px solid #fff; border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
.pv .bar { display: flex; justify-content: space-around; border-top: 1px solid #ced0d4; margin: 0 12px; padding: 6px 0; color: #65676b; font-size: 13px; }
.pv.ig { border-radius: 0; border-color: #dbdbdb; }
.pv.ig .av { background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7); width: 32px; height: 32px; font-size: 13px; }
.pv.ig .media img { aspect-ratio: 1 / 1; max-height: none; }
.pv.ig .txt { padding: 8px 12px 10px; }
/* Thumbnails open the card's preview (never a new window). */
.thumb { display: block; padding: 0; border: 0; background: none; cursor: zoom-in; }
/* Overlay: a near-fullscreen window (95vw x 92vh) holding the lightbox (image/video, prev/next) or the Xem trước panel.
   Its header carries the title, channel tabs and ✕ Đóng; Esc or a click on the backdrop also closes. */
.lb { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, .75); display: grid; place-items: center; }
.lb[hidden] { display: none; }
.lb .lb-win { width: 95vw; height: 92vh; background: var(--control); border: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.lb .lb-head { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #fff; }
.lb .lb-title { flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb .lb-extra:empty { display: none; }
.lb .lb-head nav.tabs { margin: 0; flex-wrap: wrap; }
.lb .lb-close { margin-left: auto; }
.lb .lb-body { flex: 1 1 auto; min-height: 0; display: flex; }
.lb .lb-stage { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 0; padding: 12px; background: #111; }
.lb .lb-stage img, .lb .lb-stage video { max-width: calc(95vw - 140px); max-height: calc(92vh - 90px); object-fit: contain; min-width: 0; }
.lb .lb-nav { font-size: 20px; }
/* Xem trước: the post at Facebook's feed width (500px) on the left, the draft's facts on the right (below when narrow). */
.lb .pv-layout { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
.lb .pv-stage { overflow: auto; background: #f0f2f5; padding: 16px; display: flex; justify-content: center; align-items: flex-start; }
.lb .pv-col { width: 540px; max-width: 100%; flex: 0 0 auto; display: grid; gap: 10px; align-content: start; }
.lb .pv-langs { margin: 0; }
.lb .pv-langs .meta { margin-left: 4px; }
.lb .pv-stage .pv { width: 100%; font-size: 15px; }
/* In the overlay the post's image takes the full post width (the column scrolls), as in the feed. */
.lb .pv-stage .pv .media.n1 img { max-height: none; height: auto; object-fit: contain; background: #f0f2f5; }
.pv .txt a { color: #385898; text-decoration: none; } .pv .txt a:hover { text-decoration: underline; }
.pv .txt .tag { color: #385898; }
/* Several images of a store post: one at a time at full width, ‹ › and n/m over it (like a carousel). */
.pv .car { position: relative; background: #f0f2f5; }
.pv .car img { width: 100%; height: auto; display: block; cursor: zoom-in; }
.pv .car .car-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; border: 1px solid #ced0d4; background: #fff; font-size: 20px; line-height: 1; cursor: pointer; color: #050505; }
.pv .car .car-nav.prev { left: 8px; } .pv .car .car-nav.next { right: 8px; }
.pv .car .car-count { position: absolute; right: 8px; top: 8px; background: rgba(0, 0, 0, .6); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 10px; }
.lb .pv-side { overflow: auto; padding: 12px; border-left: 1px solid var(--line); background: #fff; display: grid; gap: 10px; align-content: start; }
.lb .pv-side .kv dd { overflow-wrap: anywhere; }
.lb .pv-side pre { max-height: none; }
.lb .pv-side .row-actions { margin-top: 0; }
.lb .item-nav { display: flex; align-items: center; gap: 6px; }
/* Kho item: the post's images (‹ › between them) on the left, its facts, caption and actions on the right. */
.lb .sp-layout { grid-template-columns: minmax(0, 1fr) 380px; }
.lb .sp-dups {.lb .sp-dups { margin: 0; padding-left: 18px; font-size: 12px; }
.lb .sp-dups a { overflow-wrap: anywhere; }
@media (max-width: 900px) {
  .lb .pv-layout { grid-template-columns: 1fr; overflow: auto; }
  .lb .pv-stage { overflow: visible; }
  .lb .pv-side { border-left: 0; border-top: 1px solid var(--line); }
}
.pv [data-pv] { cursor: zoom-in; }
/* Cài đặt: short labels in a fixed column, a 2-column form, one compact row per skill. */
#page-settings .kv { grid-template-columns: 160px minmax(0, 1fr); }
#page-settings .kv dt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#page-settings .set-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; align-items: end; }
#page-settings .set-grid > div { min-width: 0; }
#page-settings .set-grid .wide { grid-column: 1 / -1; }
#page-settings .set-grid label { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 0 4px; }
#page-settings .set-grid label.check { display: flex; gap: 6px; align-items: center; height: var(--ctl-h); margin: 0; }
#page-settings details > summary { margin: 10px 0 6px; }
#page-settings .skill-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
#page-settings .skill-row .id { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#page-settings .skill-pick label { display: flex; gap: 6px; align-items: center; margin: 0; padding: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#page-settings .find-row { display: flex; gap: 8px; margin: 6px 0; } #page-settings .find-row input { flex: 1 1 auto; min-width: 0; }
@media (max-width: 600px) {
  #page-settings .kv, #page-settings .set-grid { grid-template-columns: 1fr; }
  #page-settings .kv dd { margin-bottom: 6px; }
}
</style>
</head>
<body>
<main>
  <header><img src="/icon.svg" alt=""><h1>Social Autopilot</h1></header>
  <div id="setupStatus" class="setup-status"></div>
  <nav class="tabs" id="tabs">
    <button type="button" data-page="overview">Tổng quan</button>
    <button type="button" data-page="store">Kho</button>
    <button type="button" data-page="posts">Bài đã tạo</button>
    <button type="button" data-page="prompt">Prompt</button>
    <button type="button" data-page="settings">Cài đặt</button>
  </nav>

  <section class="page" id="page-overview" hidden>
    <div class="msg" id="ovMsg"></div>
    <div class="cards" id="ovList"><div class="meta">Đang đọc…</div></div>
  </section>

  <section class="page" id="page-store" hidden>
    <div class="toolbar">
      <div><label for="resBrand">Kho</label><select id="resBrand"></select></div>
      <div><label for="resStatus">Hiện</label><select id="resStatus">
        <option value="new">Mới</option><option value="used">Đã dùng</option><option value="rejected">Đã bỏ</option><option value="">Tất cả</option></select></div>
      <div><label for="resSource">Nguồn</label><select id="resSource"></select></div>
    </div>
    <div id="resBody" class="meta">Chọn thương hiệu.</div>
  </section>

  <section class="page" id="page-posts" hidden>
    <div class="toolbar">
      <div><label for="drBrand">Thương hiệu</label><select id="drBrand"><option value="">Tất cả</option></select></div>
      <div><label for="drStatus">Hiện</label><select id="drStatus">
        <option value="">Tất cả</option><option value="working">Đang làm</option><option value="ready">Sẵn sàng</option><option value="failed">Lỗi kiểm tra</option><option value="mc_draft">Đã gửi nháp</option><option value="scheduled">Đã hẹn giờ</option><option value="published">Đã đăng</option><option value="mc_error">Lỗi Metricool</option><option value="rejected">Đã bỏ</option></select></div>
    </div>
    <div id="draftList"></div>
  </section>

  <section class="page" id="page-prompt" hidden>
    <div class="toolbar">
      <div><label for="prMode">Chế độ</label><select id="prMode"></select></div>
      <div><label for="prAgent">Agent</label><select id="prAgent"></select></div>
      <div><label for="prBrand">Thương hiệu</label><select id="prBrand"></select></div>
      <button class="btn primary" type="button" id="prCopy">Chép prompt</button><button class="btn" type="button" id="prReset">Khôi phục mặc định</button><span class="meta" id="prMsg"></span>
    </div>
    <!-- Run options of the chosen mode (one row), written into the prompt as this run's options. -->
    <div class="toolbar pr-opts" id="prResearch" hidden>
      <div><label>Nguồn</label><details class="pr-src" id="prSrcBox"><summary class="btn" id="prSrcSum">Tất cả</summary><div class="pr-src-list" id="prSrc"></div></details></div>
      <div><label for="prSince">Từ ngày</label><input type="date" id="prSince"></div>
      <div><label for="prMax">Tối đa bài mỗi nguồn</label><input type="number" id="prMax" min="1" step="1" placeholder="không giới hạn"></div>
      <div><label for="prKind">Kiểu</label><select id="prKind"><option value="new">Bài mới</option><option value="backfill">Lấy bài cũ</option><option value="full">Quét lại toàn bộ</option></select></div>
    </div>
    <div class="toolbar pr-opts" id="prMake" hidden>
      <div><label for="prCount">Số bài cần làm</label><input type="number" id="prCount" min="1" step="1" placeholder="theo cài đặt"></div>
      <div><label for="prSend">Gửi Metricool</label><select id="prSend"><option value="">Theo cài đặt</option><option value="draft">Nháp</option><option value="schedule">Hẹn giờ</option></select></div>
    </div>
    <textarea class="prompt" id="prText" spellcheck="false"></textarea>
    <div class="meta">Dán vào Claude Code/Codex.</div>
  </section>

  <section class="page" id="page-settings" hidden>
    <fieldset><legend>Cài đặt tool</legend>
      <div id="settingsView"></div>
      <div class="row-actions"><button class="btn" type="button" id="settingsEdit">Sửa</button></div>
      <div id="settingsEditor" hidden>
        <form id="settingsForm"></form>
        <div class="row-actions"><button class="btn primary" type="button" id="settingsSave" title="Ghi vào workspace/settings.json của máy này">Lưu</button></div>
      </div>
      <div class="msg" id="settingsMsg"></div>
    </fieldset>
  </section>

  <section class="page" id="page-brand" hidden>
    <div class="toolbar"><button class="btn" type="button" id="brandBack">← Tổng quan</button><h2 id="brandTitle" style="margin:0;font-size:16px"></h2></div>
    <div id="brandForm"></div>
    <div class="row-actions"><button class="btn primary" type="button" id="brandSave">Lưu</button><span class="meta">Lưu xong tool chạy check-skill; file sai thì trả lại bản cũ.</span></div>
    <div class="msg" id="brandMsg"></div>
  </section>
</main>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Every request of the page goes through call(): GET without data, POST with it.
  // Every write carries the session token the server puts in this page (meta sa-token); without it the server refuses.
  const call = (url, data) => fetch(url, data === undefined ? { cache: "no-store" } : { method: "POST", headers: { "content-type": "application/json", "x-sa-token": document.querySelector('meta[name="sa-token"]')?.content || "" }, body: JSON.stringify(data) }).then((r) => r.json());
  const getJson = (url) => call(url);
  const postJson = (url, data) => call(url, data);
  const img = (p) => `/file?path=${encodeURIComponent(p)}`;
  const store = { get: (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  const offline = { error: "Mất kết nối với app." };
  addEventListener("error", (e) => postJson("/api/client-error", { message: e.message, stack: e.error?.stack || "" }).catch(() => {}));

  // ----- tabs -----
  const pages = ["overview", "store", "posts", "prompt", "settings", "brand"];
  function show(page) {
    if (!pages.includes(page)) page = "overview";
    for (const p of pages) $(`#page-${p}`).hidden = p !== page;
    for (const b of $$("#tabs button")) b.setAttribute("aria-pressed", String(b.dataset.page === (page === "brand" ? "overview" : page)));
    store.set("page", page === "brand" ? "overview" : page);
    ({ overview: loadOverview, store: loadResearch, posts: loadDrafts, prompt: loadPrompts, settings: loadSettings })[page]?.();
  }
  for (const b of $$("#tabs button")) b.onclick = () => show(b.dataset.page);

  // ----- Tổng quan: per brand, from queue.mjs (store, last research, posts, Metricool) + the skill check -----
  let brandData = { brands: [], metricool: { brands: [] } };
  const MC_TEXT = { draft: "nháp Metricool", scheduled: "đã hẹn giờ", published: "đã đăng", error: "lỗi Metricool", not_sent: "chưa gửi" };
  // Skill picker (Chọn skill / Đổi skill): a source folder (or a skill folder path pasted), Tìm, the skill folders found
  // (one choice), then Nối: the Metricool brand points to that folder. Nothing is copied; the tool works in that folder.
  let skillSource = "";
  async function skillPicker(panel, mcName) {
    if (!panel.hidden) { panel.hidden = true; return; }
    panel.hidden = false;
    if (!skillSource) { const r = await getJson("/api/skills").catch(() => ({})); skillSource = r.default_source || ""; }

  // ----- Sửa một thương hiệu: only what people change; the rest under Nâng cao (raw JSON) -----
  let editing = null, rawMode = false;

  async function loadResearch() {

  let promptData = { prompts: [], brands: [] };

  function drawPrompt() {
    const modes = [...new Set(promptData.prompts.map((p) => p.mode))];

    $("#prBrand").innerHTML = `<option value="">Tất cả</option>` + promptData.brands.map((b) => `<option value="${esc(b.id)}"${b.id === brand ? " selected" : ""}>${esc(b.name || b.id)}${b.usable ? "" : " (đang tắt)"}</option>`).join("");

      const flags = [src.length ? `--source ${src.join(",")}` : "", since ? `--since ${since}` : "", max > 0 ? `--max-posts ${max}` : "", kind !== "new" ? `--${kind}` : ""].filter(Boolean);

  // ----- Bài đã tạo: image(s), status of the automatic checks, hosted image, Metricool; optional "Bỏ" before written -----

  const draftThumb = (d) => (d.image_exists ? d.image : (d.preview?.media || []).find((m) => m.type !== "video")?.path || "");
  // Status column: checks (status), hosted image and Metricool once the post is written into the brand.
  function draftTags(d) {

  // The draft's media for the lightbox: the post's own images/videos ("Ảnh mới"), then the shop's original (scene-swap).
  function mediaOf(d) {
    const own = (d.preview?.media?.length ? d.preview.media : d.image_exists ? [{ type: "image", path: d.image }] : []).map((m, i, all) => ({ ...m, label: m.type === "video" ? "Video" : all.length > 1 ? `Ảnh mới ${i + 1}/${all.length}` : "Ảnh mới" }));
    return d.image_mode === "scene-swap" && d.reference_image ? [...own, { type: "image", path: d.reference_image, label: "Ảnh gốc của shop" }] : own;
  }

  // ----- Overlay: a near-fullscreen window (lightbox or Xem trước), always inside the app window, never a new window -----
  const overlay = document.createElement("div");
  overlay.className = "lb";
  overlay.hidden = true;
  overlay.innerHTML = `<div class="lb-win" role="dialog" aria-modal="true"><div class="lb-head"><div class="lb-title"></div><span class="lb-extra"></span><button class="btn lb-close" type="button">✕ Đóng</button></div><div class="lb-body"></div></div>`;
  document.body.append(overlay);
  let lbKeys = null, lbItemKeys = null, lbOnClose = null;
  function closeOverlay() {
    overlay.hidden = true; for (const c of [".lb-title", ".lb-extra", ".lb-body"]) $(c, overlay).innerHTML = ""; lbKeys = lbItemKeys = null; document.body.style.overflow = "";
    const f = lbOnClose; lbOnClose = null; f?.();
  }
  // title: the header text; extra: header controls left of ✕ Đóng (channel tabs, ‹ Trước / Sau ›); body: the window's
  // content; keys: ←/→ (images, channels); itemKeys: ↑/↓ (previous/next item of the list).
  function openOverlay(title, body, keys, extra = "", itemKeys = null) {
    $(".lb-title", overlay).innerHTML = title;
    $(".lb-extra", overlay).innerHTML = extra;
    $(".lb-body", overlay).innerHTML = body;
    lbKeys = keys || null;
    lbItemKeys = itemKeys || null;
    const wasHidden = overlay.hidden;
    overlay.hidden = false;
    document.body.style.overflow = "hidden";
    if (wasHidden) $(".lb-close", overlay).focus();
  }
  $(".lb-close", overlay).onclick = closeOverlay;
  overlay.addEventListener("click", (e) => { if (e.target === overlay || e.target.classList.contains("lb-stage")) closeOverlay(); });
  document.addEventListener("keydown", (e) => {
    if (overlay.hidden) return;
    if (e.key === "Escape") { closeOverlay(); return; }
    if (e.target.closest?.("input, textarea, select")) return;
    if (lbKeys && e.key === "ArrowLeft") lbKeys(-1);
    else if (lbKeys && e.key === "ArrowRight") lbKeys(1);
    else if (lbItemKeys && (e.key === "ArrowUp" || e.key === "ArrowDown")) { e.preventDefault(); lbItemKeys(e.key === "ArrowUp" ? -1 : 1); }
  });
  function openLightbox(items, start = 0) {
    if (!items.length) return;
    let i = Math.min(Math.max(0, start), items.length - 1);
    const draw = () => {
      const m = items[i];
      const media = m.type === "video" ? `<video src="${img(m.path)}" controls autoplay></video>` : `<img src="${img(m.path)}" alt="${esc(m.label)}">`;
      openOverlay(`${esc(m.label)}${items.length > 1 ? ` · ${i + 1}/${items.length}` : ""}`,
        `<div class="lb-stage">${items.length > 1 ? `<button class="btn lb-nav" type="button" data-step="-1" aria-label="Ảnh trước">‹</button>` : ""}${media}${items.length > 1 ? `<button class="btn lb-nav" type="button" data-step="1" aria-label="Ảnh sau">›</button>` : ""}</div>`,
        (step) => { i = (i + step + items.length) % items.length; draw(); });

    };

  // Xem trước: how the post would look on each enabled channel (Facebook feed card, Instagram post), from the server's
  // preview data (page name, posted text per language_policy, reviewer-only texts, media), in the overlay panel.
  // ONE language at a time: the posted language first (EN by default), the reviewer-only reading (VN) on the switch.
  // A static mock; nothing loads from outside.
  const LANG_NAME = (l) => String(l || "").split("+").map((x) => x.toUpperCase()).join(" + ");
  // Facebook-like "… Xem thêm": past 5 lines or ~250 characters the text is cut; the rest opens in place.
  const linkify = (t) => esc(t).replace(/(https?:\/\/[^\s<]+)|(^|\s)(#[\p{L}\p{N}_]+)/gu, (m, url, sp, tag) => (url ? `<a href="${url}" target="_blank" rel="noopener">${url}</a>` : `${sp}<span class="tag">${tag}</span>`));
  function postText(text) {
    const t = String(text || "");
    let cut = t.length > 250 ? t.lastIndexOf(" ", 250) : -1;
    const nl = t.split("\n").slice(0, 5).join("\n").length;
    if (nl < t.length && (cut < 0 || nl < cut)) cut = nl;
    if (cut <= 0 || cut >= t.length) return linkify(t);
    return `<span class="rest">${linkify(t)} <button class="more" type="button" data-fold="1">Thu gọn</button></span><span class="cut" hidden>${linkify(t.slice(0, cut).trimEnd())}… <button class="more" type="button" data-fold="0">Xem thêm</button></span>`;
  }
  // "Thu gọn" / "Xem thêm" of any post mock in the overlay.
  overlay.addEventListener("click", (e) => {
    const b = e.target.closest(".pv .more");
    if (!b) return;
    const t = b.closest(".txt"), fold = b.dataset.fold === "1";
    $(".rest", t).hidden = fold; $(".cut", t).hidden = !fold;
  });
  // nav: { list, i } when opened from the list: ‹ Trước / Sau › (↑/↓) walk it without closing.
  function openPreview(d, nav = null) {
    const go = nav ? (step) => { const j = nav.i + step; if (nav.list[j]) openPreview(nav.list[j], { list: nav.list, i: j }); } : null;
    const bp = d.brand_post, canCancel = !bp && d.status !== "rejected", swap = d.image_mode === "scene-swap";
    const p = d.preview || { posts: [], media: [] };
    const initial = esc(String(p.page_name || "?").trim().charAt(0).toUpperCase());
    const media = () => {
      const m = (p.media || []).slice(0, 4);
      if (!m.length) return `<div class="video" style="aspect-ratio:1/1;background:#e4e6eb"></div>`;
      return `<div class="media n${m.length}">${m.map((x, i) => (x.type === "video" ? `<div class="video" data-pv="${i}"></div>` : `<img src="${img(x.path)}" alt="" data-pv="${i}">`)).join("")}</div>`;
    };
    const NET = { facebook: "Facebook", instagram: "Instagram" };
    const tag = (post, o) => `<div class="pv-tag">${esc(NET[post.network] || post.network)}${o.lang ? ` · ${esc(LANG_NAME(o.lang))}` : ""}${o.review ? ` · <span class="pv-ro">Chỉ để đọc, không đăng</span>` : ""}</div>`;
    const empty = "(chưa có caption)";
    const fb = (post, o) => `<div class="pv fb${o.review ? " review" : ""}">${tag(post, o)}
      <div class="pv-head"><div class="av">${initial}</div><div class="who"><b>${esc(p.page_name)}</b><span>Vừa xong · Công khai</span></div></div>
      <div class="txt">${postText(o.text || empty)}</div>${media()}<div class="bar"><span>Thích</span><span>Bình luận</span><span>Chia sẻ</span></div></div>`;
    const ig = (post, o) => `<div class="pv ig${o.review ? " review" : ""}">${tag(post, o)}
      <div class="pv-head"><div class="av">${initial}</div><div class="who"><b>${esc(post.account || p.page_name)}</b></div></div>
      ${media()}<div class="txt"><b>${esc(post.account || p.page_name)}</b> ${postText(o.text || empty)}</div></div>`;
    const card = (post, o) => (post.network === "instagram" ? ig(post, o) : post.network === "facebook" ? fb(post, o)
      : `<div class="pv">${tag(post, o)}<div class="txt">${esc(o.text)}</div></div>`);
    // Reviewer-only texts (never posted). Accepts [{lang,text}], {lang:text} or a plain string.
    const rv = p.review_texts;
    const review = (Array.isArray(rv) ? rv : rv && typeof rv === "object" ? Object.entries(rv).map(([lang, text]) => ({ lang, text })) : rv ? [{ lang: "", text: rv }] : [])
      .map((x) => (typeof x === "string" ? { lang: "", text: x } : x)).filter((x) => x && x.text).map((x) => ({ ...x, review: true }));

    // A channel's language options: its posted texts (EN first), then the reviewer-only readings.
    const optionsOf = (post) => [...[...(post?.texts || [])].sort((a, b) => (b.lang === "en") - (a.lang === "en")), ...review];

        ${review.length ? `<dt>Chỉ để đọc</dt><dd>${esc(review.map((x) => LANG_NAME(x.lang)).join(", "))} <span class="meta">(không đăng)</span></dd>` : ""}
        <dt>Đang xem</dt><dd>${o ? `${esc(LANG_NAME(o.lang) || "-")} · ${o.review ? `<span class="warn-text">Chỉ để đọc, không đăng</span>` : `<span class="ok-text">Đăng</span>`}` : "-"}</dd>

        <dt>Giờ đăng</dt><dd>${esc(plannedOf(d))}</dd>
        <dt>Link ảnh</dt><dd>${mediaUrl ? `<a href="${esc(mediaUrl)}" target="_blank" rel="noopener">${esc(mediaUrl)}</a>` : `<span class="muted">Chưa có</span>`}</dd>
      </dl>

      ${d.problems?.length ? `<ul class="missing">${d.problems.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${d.error ? `<div class="bad-text">${esc(d.error)}</div>` : ""}
      ${d.status === "rejected" ? `<div class="bad-text">Đã bỏ${d.note ? `: ${esc(d.note)}` : ""}</div>` : ""}
      <div class="meta">${esc(d.languages?.join(", ") || "")} (${esc(d.language_mode || "-")})${d.inspiration_url ? ` · <a href="${esc(d.inspiration_url)}" target="_blank" rel="noopener">bài tham khảo</a>` : ""} · ${d.metadata_clean ? `metadata đã bỏ, điểm ảnh giữ nguyên: ${d.metadata_clean.pixels_identical ? "có" : "KHÔNG"}` : "chưa làm sạch metadata"}${d.watermark ? ` · watermark ${esc(d.watermark.position)}` : ""}${swap ? ` · ${d.logo_check ? `đã xác nhận sạch logo (${esc(d.logo_check.by)})` : "chưa xác nhận sạch logo"}` : ""}</div>
      ${swap && d.reference_image ? `<div class="row-actions"><button class="btn" type="button" data-orig>Xem ảnh gốc của shop</button></div>` : ""}
      ${canCancel ? `<div class="row-actions"><button class="btn" type="button" data-act="cancel">Bỏ</button><span class="meta">Chỉ bỏ được khi chưa ghi vào thương hiệu.</span></div>
        <div class="reject-box" hidden><input class="note" placeholder="Lý do (không bắt buộc)"><button class="btn" type="button" data-act="cancel-go">Xác nhận bỏ</button></div>` : ""}
      <div class="msg"></div>
      <div class="meta">${esc(d.dir)}${bp?.folder ? `<br>${esc(bp.folder)}` : ""}</div>`;
    const title = `Xem trước ${esc(bp?.post ? `${bp.post} · ` : "")}${esc(d.id)} <span class="meta">(mô phỏng${bp?.metricool === "published" ? "" : ", chưa đăng"})</span>`;
    let lang = null; // the chosen language, kept when switching channel
    const keyOf = (o) => `${o.review ? "r" : "p"}:${o.lang}`;
    const draw = (k) => {
      const post = posts[k];
      const opts = optionsOf(post);
      const o = opts.find((x) => keyOf(x) === lang) || opts[0] || null;
      if (o) lang = keyOf(o);
      const chan = posts.length > 1 ? `<nav class="tabs">${posts.map((x, j) => `<button type="button" data-tab="${j}" aria-pressed="${j === k}">${esc(NET[x.network] || x.network)}</button>`).join("")}</nav>` : "";
      const langBar = opts.length > 1 ? `<nav class="tabs pv-langs" aria-label="Ngôn ngữ">${opts.map((x, j) => `<button type="button" data-lang="${j}" aria-pressed="${x === o}">${esc(LANG_NAME(x.lang) || "?")} <span class="meta">${x.review ? "Chỉ để đọc, không đăng" : "Đăng"}</span></button>`).join("")}</nav>` : "";
      openOverlay(title, `<div class="pv-layout"><div class="pv-stage"><div class="pv-col">${langBar}${post && o ? card(post, o) : `<div class="meta">Chưa bật kênh nào.</div>`}</div></div><div class="pv-side">${side(post, o)}</div></div>`,
        posts.length > 1 ? (step) => draw((k + step + posts.length) % posts.length) : null, chan + (nav ? itemNav(nav.i, nav.list.length) : ""), go);
      if (nav) lbOnClose = () => focusCard("#draftList .draft", d.id);
      for (const b of $$("[data-item]", overlay)) b.onclick = () => go(Number(b.dataset.item));
      const sideBox = $(".pv-side", overlay);

      if ($("[data-orig]", sideBox)) $("[data-orig]", sideBox).onclick = () => big(mediaOf(d).length - 1);

      for (const b of $$("[data-lang]", overlay)) b.onclick = () => { lang = keyOf(opts[Number(b.dataset.lang)]); draw(k); };

  // Hosted image link (hosting runs automatically after the post is written into the brand; no button here).

    const m = !r.error && mb ? await postJson("/api/metricool-brands", mb).catch(() => offline) : {};
    const err = r.error || m.error;
    $("#settingsMsg").innerHTML = err ? `<span class="bad-text">${esc(err)}</span>` : `<span class="ok-text">Đã lưu.</span>`;
    if (!err) { $("#settingsEditor").hidden = true; $("#settingsEdit").textContent = "Sửa"; loadSettings(); }
  };

  show(store.get("page") || "overview");
  // No "Tải lại" per tab: a tab reloads when opened and when a filter changes, and every 45 s while it is visible,
  // except while the preview is open, the window is hidden or something is being typed (a Bỏ reason).
  setInterval(() => {
    if (document.hidden || !overlay.hidden || document.activeElement?.matches?.("input, textarea, select")) return;
    if ($$("#resBody .reject-box, #draftList .reject-box").some((b) => !b.hidden)) return;
    if (!$("#page-overview").hidden) loadOverview();
    else if (!$("#page-store").hidden) loadResearch();
    else if (!$("#page-posts").hidden) loadDrafts();
  }, 45000);
})();
</script>
</body>
</html>
