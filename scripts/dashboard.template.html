details.cap summary::-webkit-details-marker { display: none; }
details.cap summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }

.empty-state .t { color: var(--foreground); }

  h1 { font-size: 20px; }

<header class="site-header">

  </div>

<main class="container main" id="app">

<script id="sa-data" type="application/json">/*__DATA__*/null</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("sa-data").textContent || "null");
  var app = document.getElementById("app");
  if (!D) { app.innerHTML = '<div class="alert">Chưa có dữ liệu. Chạy <code>node scripts/dashboard.mjs</code>.</div>'; return; }

  var STATUS = {
    awaiting_approval: ["Chờ duyệt", "c-amber"], approved: ["Đã duyệt", "c-green"], rejected: ["Đã bỏ", "c-red"],
    needs_prompt: ["Cần hoàn thiện prompt", "c-blue"], generating: ["Đang tạo ảnh", "c-violet"], needs_caption: ["Cần caption hoặc sửa", "c-blue"],
    image_failed: ["Tạo ảnh lỗi", "c-red"], preparing: ["Đang chuẩn bị", "c-slate"]
  };
  var RUN = { open: ["Đang lấy bài", "c-blue"], ingested: ["Đã lấy xong", "c-green"] };
  var IDEA = { todo: "chưa điền", ready: "sẵn sàng", picked: "đã chọn", drafted: "đã làm nháp", rejected: "đã bỏ" };
  var LANG = { vn: "Tiếng Việt", vi: "Tiếng Việt", en: "English", de: "Deutsch", fr: "Français", ja: "日本語", ko: "한국어", zh: "中文" };
  var IN_PROGRESS = ["needs_prompt", "generating", "needs_caption", "image_failed", "preparing"];

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmt(iso, withDate) {
    if (!iso) return "";
    var d = new Date(iso); if (isNaN(d)) return esc(iso);
    var t = pad(d.getHours()) + ":" + pad(d.getMinutes());
    return withDate === false ? t : t + " " + pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear();
  }
  function day(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? m[3] + "/" + m[2] + "/" + m[1] : esc(s); }
  function badge(map, key) { var v = map[key] || [key, "c-slate"]; return '<span class="status ' + v[1] + '">' + esc(v[0]) + "</span>"; }
  function pill(text, cls) { return '<span class="status ' + cls + '">' + esc(text) + "</span>"; }
  function link(url, text) { return url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(text || url) + "</a>" : ""; }
  function lang(l) { return LANG[l] || String(l).toUpperCase(); }
  function brandName(id) { var b = D.brands.find(function (x) { return x.id === id; }); return b ? b.name : id; }
  function empty(title, sub) { return '<div class="empty-state"><span class="t">' + esc(title) + "</span>" + (sub ? '<span class="small">' + sub + "</span>" : "") + "</div>"; }
  function head(id, title, n, hint) {
    return '<div class="section-head"><h2 id="' + id + '">' + esc(title) + "</h2>" + (n == null ? "" : '<span class="count">' + n + "</span>") + (hint ? '<span class="hint small muted">' + hint + "</span>" : "") + "</div>";
  }

  var KEY = "sa-dashboard-brand", filter = "";
  try { filter = localStorage.getItem(KEY) || ""; } catch (e) {}
  if (filter && !D.brands.some(function (b) { return b.id === filter; })) filter = "";
  function mine(x) { return !filter || x.brand === filter || x.id === filter; }

  function pic(url, path, label, alt) {
    var body = url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener" title="' + esc(path) + '"><img loading="lazy" src="' + esc(url) + '" alt="' + esc(alt) + '"></a>' : '<div class="none">Chưa có ảnh</div>';
    return '<div class="pic">' + body + (label ? '<span class="small muted">' + esc(label) + "</span>" : "") + "</div>";
  }

  function draftCard(d) {
    var swap = d.image_mode === "scene-swap";
    var pics = swap
      ? '<div class="pics two">' + pic(d.reference_image, d.reference_path, "Ảnh gốc của shop" + (d.source_shop ? " (" + d.source_shop + ")" : ""), "Ảnh gốc") + pic(d.image, d.image_path, "Ảnh mới của thương hiệu", "Ảnh mới") + "</div>"
      : '<div class="pics">' + pic(d.image, d.image_path, "", "Ảnh bài") + "</div>";
    var caps = d.captions.length ? d.captions.map(function (c, i) {
      return '<details class="cap"' + (i === 0 ? " open" : "") + "><summary>Caption " + esc(lang(c.lang)) + ' <span class="muted small">' + c.text.length + " ký tự</span></summary><pre>" + esc(c.text) + "</pre></details>";
    }).join("") : '<div class="alert">Chưa có caption.</div>';
    var info = '<dl class="info"><dt>Ý tưởng</dt><dd>' + esc(d.idea) + "</dd>" +
      "<dt>Kênh</dt><dd>" + (d.networks.map(function (n) { return '<span class="tag">' + esc(n) + "</span>"; }).join(" ") || "—") + "</dd>" +
      "<dt>Cảm hứng từ</dt><dd>" + (link(d.inspiration, "Bài tham khảo") || "—") + "</dd>" +
      "<dt>Kiểu ảnh</dt><dd>" + (swap ? "Đổi cảnh ảnh của shop (scene-swap)" + (d.logo_check ? ' <span class="ok-text small">· đã xác nhận sạch logo' + (d.logo_check.by ? " (" + esc(d.logo_check.by) + ")" : "") + "</span>" : "") : "Ảnh của thương hiệu") + "</dd>" +
      "<dt>Tạo lúc</dt><dd>" + fmt(d.created) + "</dd>" +
      "<dt>Thư mục</dt><dd><code>" + esc(d.dir) + "</code></dd></dl>";
    var warn = d.problems && d.problems.length ? '<div class="alert">Cần xem lại:<ul>' + d.problems.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ul></div>" : "";
    var say = "duyệt " + d.id;
    return '<article class="card" data-brand="' + esc(d.brand) + '">' +
      '<div class="card-head"><span class="id">' + esc(d.id) + '</span><span class="tag">' + esc(brandName(d.brand)) + "</span>" + (swap ? '<span class="tag">scene-swap</span>' : "") + '<span class="right">' + badge(STATUS, d.status) + "</span></div>" +
      pics + info + warn + '<div style="display:grid;gap:6px">' + caps + "</div>" +
      '<div class="say"><span class="muted">Nhắn agent:</span><code>' + esc(say) + '</code><button class="btn copy" type="button" data-copy="' + esc(say) + '">Chép</button><span class="muted small">hoặc</span><code>bỏ ' + esc(d.id) + ': lý do</code></div>' +
      "</article>";
  }

  function render() {
    var brands = D.brands.filter(mine), drafts = D.drafts.filter(mine), runs = D.runs.filter(mine);
    var waiting = drafts.filter(function (d) { return d.status === "awaiting_approval"; });
    var working = drafts.filter(function (d) { return IN_PROGRESS.indexOf(d.status) >= 0; });
    var done = drafts.filter(function (d) { return d.status === "approved" || d.status === "rejected" || d.brand_post; });
    var approved = drafts.filter(function (d) { return d.brand_post; });
    var ready = brands.filter(function (b) { return b.usable; });
    var age = (Date.now() - new Date(D.generated_at)) / 36e5;
    var h = [];

    h.push('<div class="page-head"><h1>Bảng trạng thái</h1><p class="muted">Trang chỉ để xem. Duyệt, bỏ hay sửa cài đặt thương hiệu: nhắn agent trong chat.</p></div>');
    h.push('<div class="refresh' + (age > 24 ? " stale" : "") + '"><span>Dữ liệu lúc <span class="when">' + fmt(D.generated_at) + (age > 24 ? " (đã cũ hơn 1 ngày)" : "") + '</span></span><span class="muted">·</span><span>Làm mới: bấm đúp <code>open-dashboard.cmd</code> hoặc chạy</span><code>' + esc(D.refresh) + '</code><button class="btn copy" type="button" data-copy="' + esc(D.refresh) + '">Chép lệnh</button></div>');

    if (D.brands.length > 1) {
      h.push('<div class="tabs-list" role="tablist" aria-label="Lọc theo thương hiệu"><button type="button" role="tab" data-brand=""' + (filter ? "" : ' class="active" aria-selected="true"') + '>Tất cả <span class="n">' + D.brands.length + "</span></button>" +
        D.brands.map(function (b) {
          var n = D.drafts.filter(function (d) { return d.brand === b.id && d.status === "awaiting_approval"; }).length;
          return '<button type="button" role="tab" data-brand="' + esc(b.id) + '"' + (filter === b.id ? ' class="active" aria-selected="true"' : "") + ">" + esc(b.name) + (n ? ' <span class="n">' + n + " chờ</span>" : "") + "</button>";
        }).join("") + "</div>");
    }

    var L = D.limits;
    function stat(href, k, v, d, c) { return '<a class="stat" href="#' + href + '"><span class="k"><span class="dot" style="--c:var(--' + c + ')"></span>' + esc(k) + '</span><span class="v">' + v + '</span><span class="d">' + d + "</span></a>"; }
    h.push('<section class="stats" aria-label="Tổng quan">' +
      stat("s-brands", "Thương hiệu sẵn sàng", ready.length, "trên " + brands.length + " thương hiệu", "green") +
      stat("s-brands", "Chưa sẵn sàng", brands.length - ready.length, "đang tắt hoặc còn thiếu", "amber") +
      stat("s-waiting", "Chờ duyệt", waiting.length, "bản nháp đợi bạn xem", "amber") +
      stat("s-working", "Đang làm", working.length, "chưa xong ảnh hoặc caption", "blue") +
      stat("s-done", "Đã duyệt", approved.length, "đã ghi vào thương hiệu, chưa đăng", "green") +
      stat("s-research", "Bài nghiên cứu hôm nay", L.used_today + "/" + L.max_posts_per_day, "mọi thương hiệu, còn " + L.remaining, "slate") +
      "</section>");

    // Awaiting approval
    h.push('<section class="section">' + head("s-waiting", "Chờ duyệt", waiting.length, "Bấm ảnh để xem cỡ lớn") +
      (waiting.length ? '<div class="cards">' + waiting.map(draftCard).join("") + "</div>" : empty("Không có bản nháp nào chờ duyệt", "Vòng chạy theo lịch sẽ thêm bản nháp mới ở đây.")) + "</section>");

    // Brands
    var rows = brands.map(function (b) {
      var st = b.usable ? pill("Sẵn sàng", "c-green") : !b.enabled && b.ready ? pill("Đang tắt", "c-slate") : !b.enabled ? pill("Tắt · còn thiếu", "c-amber") : pill("Bật nhưng còn thiếu", "c-red");
      var miss = b.missing.length ? '<ul class="list">' + b.missing.map(function (m) { return "<li><span>" + esc(m.text) + "</span>" + (m.field ? '<span class="field">' + esc(m.field) + "</span>" : "") + "</li>"; }).join("") + "</ul>"
        : '<span class="ok-text">Đủ</span>' + (b.enabled ? "" : '<div class="small muted">Bật bằng enabled: true trong social.json</div>');
      var src = b.sources.length ? '<div class="tags">' + b.sources.map(function (x) { return x.url ? '<a class="tag" href="' + esc(x.url) + '" target="_blank" rel="noopener" title="' + esc(x.what_to_take) + '">' + esc(x.name) + "</a>" : '<span class="tag">' + esc(x.name) + "</span>"; }).join("") + "</div>" : '<span class="muted">Chưa có</span>';
      var rt = b.research_today ? b.research_today.collected + " bài · " + b.research_today.runs + "/" + b.max_per_day + " lượt" : "—";
      var opts = [b.ai_scenes_allowed === true ? "Dựng cảnh AI" : b.ai_scenes_allowed === false ? "Không dựng cảnh AI" : "", b.scene_swap ? "Scene-swap" : "", b.watermark ? "Watermark" : ""].filter(Boolean);
      return "<tr><td><div class=\"cell-main\"><span style=\"color:var(--foreground);font-size:13.5px\">" + esc(b.name) + "</span><span>" + esc(b.id) + "</span></div></td>" +
        '<td class="nowrap">' + st + "</td><td>" + miss + "</td>" +
        "<td>" + (b.channels.length ? '<div class="tags">' + b.channels.map(function (c) { return '<span class="tag">' + esc(c) + "</span>"; }).join("") + "</div>" : '<span class="muted">—</span>') +
        (b.languages.length ? '<div class="small muted" style="margin-top:4px">' + b.languages.map(lang).join(", ") + "</div>" : "") + "</td>" +
        "<td>" + (b.owner ? esc(b.owner) : '<span class="muted">Chưa có</span>') + "</td>" +
        "<td>" + src + '<div class="small muted" style="margin-top:4px">' + b.sources.length + " bật / " + b.sources_total + " khai báo</div></td>" +
        '<td class="nowrap">' + rt + (b.posts_per_week ? '<div class="small muted">' + b.posts_per_week + " bài/tuần</div>" : "") + "</td>" +
        "<td>" + (opts.length ? '<div class="tags">' + opts.map(function (o) { return '<span class="tag">' + esc(o) + "</span>"; }).join("") + "</div>" : '<span class="muted">—</span>') + "</td></tr>";
    }).join("");
    var skipped = !filter && D.skipped.length ? '<p class="small muted">Bỏ qua (không phải thư mục thương hiệu): ' + D.skipped.map(function (s) { return esc(s.dir.split(/[\\/]/).pop()) + " (" + esc(s.reason) + ")"; }).join(", ") + "</p>" : "";
    h.push('<section class="section">' + head("s-brands", "Thương hiệu", brands.length, "Thư mục: <code>" + esc(D.skills_root) + "</code>") +
      (brands.length ? '<div class="table-card"><div class="table-scroll"><table class="table"><thead><tr><th>Thương hiệu</th><th>Trạng thái</th><th>Còn thiếu</th><th>Kênh · ngôn ngữ</th><th>Người duyệt</th><th>Nguồn tham khảo</th><th>Nghiên cứu hôm nay</th><th>Ảnh</th></tr></thead><tbody>' + rows + "</tbody></table></div></div>" : empty("Không tìm thấy thương hiệu nào", "Kiểm tra skillsRoot trong cài đặt.")) +
      skipped + "</section>");

    // In progress
    h.push('<section class="section">' + head("s-working", "Đang làm", working.length) +
      (working.length ? '<div class="table-card"><div class="table-scroll"><table class="table"><thead><tr><th>Mã</th><th>Thương hiệu</th><th>Trạng thái</th><th>Ý tưởng</th><th>Ghi chú</th><th>Cập nhật</th></tr></thead><tbody>' +
        working.map(function (d) {
          var notes = [d.error].concat(d.problems || []).filter(Boolean);
          return '<tr><td class="mono nowrap">' + esc(d.id) + "</td><td>" + esc(brandName(d.brand)) + '</td><td class="nowrap">' + badge(STATUS, d.status) + "</td><td>" + esc(d.idea) + "</td><td>" + (notes.length ? '<ul class="list">' + notes.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul>" : '<span class="muted">—</span>') + '</td><td class="nowrap small muted">' + fmt(d.updated || d.created) + "</td></tr>";
        }).join("") + "</tbody></table></div></div>" : empty("Không có bản nháp nào đang làm")) + "</section>");

    // Approved / rejected
    h.push('<section class="section">' + head("s-done", "Đã duyệt và đã bỏ", done.length, "Chưa đăng ở đâu: Publish (Metricool) làm sau") +
      (done.length ? '<div class="table-card"><div class="table-scroll"><table class="table"><thead><tr><th>Mã</th><th>Thương hiệu</th><th>Kết quả</th><th>Bài trong thương hiệu</th><th>Người duyệt · ghi chú</th><th>Lúc</th></tr></thead><tbody>' +
        done.map(function (d) {
          return '<tr><td class="mono nowrap">' + esc(d.id) + "</td><td>" + esc(brandName(d.brand)) + '</td><td class="nowrap">' + badge(STATUS, d.brand_post ? "approved" : d.status) + "</td><td>" + (d.brand_post ? '<div class="cell-main"><span style="color:var(--foreground);font-size:13.5px" class="mono">' + esc(d.brand_post.id) + "</span><span>" + esc(d.brand_post.folder) + "</span></div>" : '<span class="muted">—</span>') + "</td><td>" + esc(d.by || "—") + (d.note ? '<div class="small muted">' + esc(d.note) + "</div>" : "") + '</td><td class="nowrap small muted">' + fmt(d.approved || d.rejected || d.updated) + "</td></tr>";
        }).join("") + "</tbody></table></div></div>" : empty("Chưa có bài nào được duyệt hay bỏ")) + "</section>");

    // Research
    h.push('<section class="section">' + head("s-research", "Nghiên cứu gần đây", runs.length, "Tối đa " + L.max_sources_per_run + " nguồn mỗi lượt, " + L.max_posts_per_source + " bài mỗi nguồn") +
      (runs.length ? '<div class="table-card"><div class="table-scroll"><table class="table"><thead><tr><th>Ngày</th><th>Thương hiệu</th><th>Trạng thái</th><th>Nguồn · số bài lấy</th><th>Ý tưởng</th></tr></thead><tbody>' +
        runs.map(function (r) {
          var ideas = Object.keys(r.ideas).map(function (k) { return '<span class="tag">' + esc(IDEA[k] || k) + " " + r.ideas[k] + "</span>"; }).join("");
          return '<tr><td class="nowrap">' + day(r.date) + "</td><td>" + esc(brandName(r.brand)) + '</td><td class="nowrap">' + badge(RUN, r.status) + '</td><td><div class="tags">' +
            r.sources.map(function (x) { return '<span class="tag" title="' + esc(x.url) + '">' + esc(x.name) + " · " + (x.raw ? x.refs + " bài" : "chưa lấy") + "</span>"; }).join("") + '</div><div class="small muted" style="margin-top:4px">Tổng ' + r.refs + " bài</div></td><td>" + (ideas ? '<div class="tags">' + ideas + "</div>" : '<span class="muted">Chưa có</span>') + "</td></tr>";
        }).join("") + "</tbody></table></div></div>" : empty("Chưa có lượt nghiên cứu nào", "Lượt đầu tiên mở khi có thương hiệu sẵn sàng.")) + "</section>");

    // Errors
    if (!filter && D.errors.length) {
      h.push('<section class="section">' + head("s-errors", "Lỗi gần đây", D.errors.length, "Từ workspace/logs") + '<div class="table-card"><div class="table-scroll"><table class="table"><thead><tr><th>Lúc</th><th>Lệnh</th><th>Lỗi</th></tr></thead><tbody>' +
        D.errors.map(function (e) { return '<tr><td class="nowrap small muted">' + fmt(e.at) + '</td><td class="mono">' + esc(e.script + " " + e.args) + "</td><td>" + esc(e.error) + "</td></tr>"; }).join("") + "</tbody></table></div></div></section>");
    }

    // Settings
    var S = D.settings, A = S.approval || {};
    function yes(v) { return v ? "Có" : "Không"; }
    h.push('<section class="section">' + head("s-settings", "Giới hạn và cài đặt") + '<div class="grid2">' +
      '<div class="panel"><h3>Nghiên cứu (giới hạn trong code)</h3><dl class="info">' +
        "<dt>Mỗi ngày</dt><dd>" + L.max_posts_per_day + " bài cho mọi thương hiệu (đã dùng " + L.used_today + ")</dd>" +
        "<dt>Mỗi lượt</dt><dd>" + L.max_sources_per_run + " nguồn, " + L.max_posts_per_source + " bài mỗi nguồn</dd>" +
        "<dt>Nghỉ giữa thao tác</dt><dd>" + (L.delay_seconds || []).join("–") + " giây</dd>" +
        "<dt>Đăng bài</dt><dd>" + esc(S.publish) + "</dd></dl></div>" +
      '<div class="panel"><h3>Duyệt</h3><dl class="info">' +
        "<dt>Đúng người duyệt</dt><dd>" + yes(A.require_owner_match) + "</dd>" +
        "<dt>Bắt buộc có ảnh</dt><dd>" + yes(A.require_image) + "</dd>" +
        "<dt>Đủ caption</dt><dd>" + yes(A.require_all_captions) + "</dd>" +
        "<dt>Bỏ cần lý do</dt><dd>" + yes(A.reject_requires_note) + "</dd></dl></div>" +
      '<div class="panel" style="grid-column:1/-1"><h3>Đường dẫn và công cụ</h3><dl class="info">' +
        "<dt>Thương hiệu</dt><dd><code>" + esc(S.skillsRootResolved) + "</code></dd>" +
        "<dt>Dữ liệu chạy</dt><dd><code>" + esc(D.workspace) + "</code></dd>" +
        "<dt>Tạo ảnh</dt><dd><code>" + esc((S.codex && S.codex.command) || "") + "</code> · tối đa " + esc((S.codex && S.codex.timeout_minutes) || "") + " phút</dd>" +
        "<dt>Làm sạch metadata</dt><dd><code>" + esc(S.remove_watermark) + "</code></dd>" +
        "<dt>Watermark</dt><dd><code>" + esc(S.ffmpeg) + "</code></dd>" +
        "<dt>Cài đặt riêng máy</dt><dd>" + (S.local_override ? "Có (workspace/settings.json đè config/settings.json)" : "Không (dùng config/settings.json)") + "</dd></dl></div>" +
      "</div></section>");

    h.push('<details class="howto"><summary>Cách dùng</summary><ol>' +
      "<li>Agent chạy theo lịch: nghiên cứu, làm ảnh và caption, cuối vòng tự làm mới trang này.</li>" +
      "<li>Xem mục <b>Chờ duyệt</b>. Ổn thì nhắn agent <code>duyệt &lt;mã&gt;</code>, không ổn thì <code>bỏ &lt;mã&gt;: lý do</code>.</li>" +
      "<li>Thương hiệu còn thiếu: nhắn agent điền phần thiếu vào social.json của thương hiệu đó.</li>" +
      "<li>Không có gì được đăng tự động. Bài đã duyệt nằm trong thư mục <code>workspace/posts</code> của thương hiệu.</li></ol></details>");
    h.push('<p class="foot">Tạo bởi <code>scripts/dashboard.mjs</code> lúc ' + fmt(D.generated_at) + ". Trang tĩnh, không gửi dữ liệu đi đâu.</p>");

    app.innerHTML = h.join("");
  }

  document.getElementById("genShort").textContent = fmt(D.generated_at);
  app.addEventListener("click", function (e) {
    var tab = e.target.closest("[role=tab]");
    if (tab) {
      filter = tab.getAttribute("data-brand") || "";
      try { localStorage.setItem(KEY, filter); } catch (err) {}
      render();
      return;
    }
    var btn = e.target.closest(".copy");
    if (btn) {
      var text = btn.getAttribute("data-copy");
      var ok = function () { btn.classList.add("done"); btn.textContent = "Đã chép"; setTimeout(function () { btn.classList.remove("done"); btn.textContent = "Chép"; }, 1500); };
      var fallback = function () { var t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); ok(); } catch (err) {} t.remove(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
    }
  });
  render();
})();
</script>
</body>
</html>
