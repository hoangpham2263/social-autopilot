<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Autopilot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Cpath d='M9 20l5-5 4 4 6-7' fill='none' stroke='%23fafafa' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<!-- Optional: Geist from Google Fonts. Offline the page falls back to the system font. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist&family=Geist+Mono&display=swap">
<style>
/* shadcn/ui (new-york, zinc) tokens as in hoangpham2263/job-hunt; house rules: one weight (400), states by border, no shadow. */
:root {
  --background: #ffffff; --foreground: #09090b; --card: #ffffff;
  --muted: #f4f4f5; --muted-foreground: #71717a;
  --border: #e4e4e7; --input: #e4e4e7; --ring: #a1a1aa; --strong: #18181b;
  --primary: #18181b; --primary-foreground: #fafafa; --destructive: #dc2626;
  --amber: #d97706; --green: #16a34a; --slate: #64748b;
  --radius: 0.5rem; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: #09090b; --foreground: #fafafa; --card: #09090b; --muted: #27272a; --muted-foreground: #a1a1aa;
    --border: #27272a; --input: #27272a; --ring: #52525b; --strong: #d4d4d8; --primary: #fafafa; --primary-foreground: #18181b;
    --destructive: #f87171; --amber: #fbbf24; --green: #4ade80; --slate: #94a3b8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --background: #09090b; --foreground: #fafafa; --card: #09090b; --muted: #27272a; --muted-foreground: #a1a1aa;
  --border: #27272a; --input: #27272a; --ring: #52525b; --strong: #d4d4d8; --primary: #fafafa; --primary-foreground: #18181b;
  --destructive: #f87171; --amber: #fbbf24; --green: #4ade80; --slate: #94a3b8; color-scheme: dark;
}
* { box-sizing: border-box; border-color: var(--border); font-weight: 400; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--background); color: var(--foreground); font: 14px/1.5 "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-underline-offset: 3px; }
h1 { font-size: 20px; line-height: 1.2; letter-spacing: -.02em; margin: 0; }
h2 { font-size: 17px; letter-spacing: -.01em; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted-foreground); }
.small { font-size: 12.5px; }
code { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; padding: 1px 5px; border: 1px solid var(--border); border-radius: 4px; background: var(--muted); overflow-wrap: anywhere; }
[hidden] { display: none !important; }
:focus-visible { outline: none; }

/* shadcn/ui container (tailwind: center, padding 2rem, 2xl 1400px; breakpoints 640/768/1024/1280); 1rem gutter on phones. */
.container { width: 100%; margin-right: auto; margin-left: auto; padding-right: 1rem; padding-left: 1rem; }
@media (min-width: 640px) { .container { max-width: 640px; padding-right: 2rem; padding-left: 2rem; } }
@media (min-width: 768px) { .container { max-width: 768px; } }
@media (min-width: 1024px) { .container { max-width: 1024px; } }
@media (min-width: 1280px) { .container { max-width: 1280px; } }
@media (min-width: 1400px) { .container { max-width: 1400px; } }
/* Spacing as ui.shadcn.com dashboard: sections gap-4 / md:gap-6, page py-4 / md:py-6, card grids gap-4. */
.main { padding-top: 1rem; padding-bottom: 1.5rem; display: grid; gap: 1rem; }
@media (min-width: 768px) { .main { padding-top: 1.5rem; padding-bottom: 3rem; gap: 1.5rem; } }

/* Sticky header, full width with a bottom border; its row uses the same container (h-14 like ui.shadcn.com). */
.site-header { position: sticky; top: 0; z-index: 50; width: 100%; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--background) 95%, transparent); backdrop-filter: blur(8px); }
.header-inner { height: 3.5rem; display: flex; align-items: center; gap: 10px; }
.logo { width: 24px; height: 24px; border-radius: 6px; background: var(--primary); color: var(--primary-foreground); display: grid; place-content: center; flex-shrink: 0; }
.logo svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.site-header h1 { font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; color: var(--muted-foreground); }
.site-header .meta { margin-left: auto; flex-wrap: nowrap; min-width: 0; white-space: nowrap; }
.meta.stale .when { color: var(--amber); }
.refresh-group { display: inline-flex; align-items: center; gap: 8px; }
.phone-only { display: none; }
@media (max-width: 767px) { .site-header .refresh-part { display: none; } .phone-only { display: flex; } }
.warn { padding: 6px 10px; border: 1px solid color-mix(in srgb, var(--amber) 45%, var(--border)); border-radius: calc(var(--radius) - 2px); color: var(--amber); font-size: 12.5px; }

.btn { display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; height: 28px; padding: 0 10px; border-radius: calc(var(--radius) - 2px);
  border: 1px solid var(--input); background: var(--background); color: inherit; font: inherit; font-size: 12.5px; cursor: pointer; transition: border-color .15s; }
.btn:hover { border-color: var(--ring); }
.btn:focus-visible, .btn:active { border-color: var(--strong); }
.btn.done { border-color: var(--green); color: var(--green); }

.tabs-list { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--radius); background: var(--muted); max-width: 100%; overflow-x: auto; justify-self: start; }
.tabs-list button { height: 28px; padding: 0 12px; border: 1px solid transparent; border-radius: calc(var(--radius) - 2px); background: none; font: inherit; font-size: 13px; color: var(--muted-foreground); cursor: pointer; white-space: nowrap; }
.tabs-list button:hover { border-color: var(--border); color: var(--foreground); }
.tabs-list button.active { background: var(--background); color: var(--foreground); border-color: var(--border); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.stat { display: grid; gap: 2px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); text-decoration: none; transition: border-color .15s; }
.stat:hover { border-color: var(--ring); }
.stat .k { font-size: 12.5px; color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; }
.stat .v { font-size: 26px; letter-spacing: -.02em; line-height: 1.2; }
.stat .v small { font-size: 15px; color: var(--muted-foreground); }
.stat .d { font-size: 12px; color: var(--muted-foreground); }
.dot { width: 7px; height: 7px; border-radius: 999px; background: var(--c, var(--slate)); flex-shrink: 0; }

.section { display: grid; gap: 10px; scroll-margin-top: 16px; }
.section-head { display: flex; align-items: baseline; gap: 8px; }
.count { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--muted-foreground); padding: 0 7px; border: 1px solid var(--border); border-radius: 999px; }

.status { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; white-space: nowrap; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--c, var(--slate)); }
.c-green { --c: var(--green); } .c-amber { --c: var(--amber); } .c-red { --c: var(--destructive); } .c-slate { --c: var(--slate); }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 4px; background: var(--muted); font-size: 12px; white-space: nowrap; }

.cards { display: grid; gap: 1rem; grid-template-columns: 1fr; }
@media (min-width: 860px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.card-head .id { font-family: "Geist Mono", monospace; font-size: 12.5px; margin-right: auto; }
.pics { display: grid; gap: 8px; grid-template-columns: 1fr; }
.pics.two { grid-template-columns: 1fr 1fr; }
.pic { display: grid; gap: 3px; min-width: 0; }
.pic a { display: block; border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); overflow: hidden; background: var(--muted); transition: border-color .15s; }
.pic a:hover { border-color: var(--ring); }
.pic img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: contain; }
.pics:not(.two) img, .pics:not(.two) .none { max-height: 300px; }
.pic .none { aspect-ratio: 1 / 1; display: grid; place-content: center; border: 1px dashed var(--border); border-radius: calc(var(--radius) - 2px); color: var(--muted-foreground); font-size: 12.5px; }
.idea { font-size: 13.5px; }
.line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 12.5px; color: var(--muted-foreground); }
details.cap { border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); }
details summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: ""; width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .15s; }
details[open] > summary::before { transform: rotate(45deg); }
details.cap summary { padding: 6px 10px; font-size: 13px; border: 1px solid transparent; border-radius: calc(var(--radius) - 2px); }
details.cap summary:hover { border-color: var(--ring); }
details.cap pre { margin: 0; padding: 8px 10px 10px; border-top: 1px solid var(--border); white-space: pre-wrap; font: inherit; font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
details.more summary { font-size: 12px; color: var(--muted-foreground); }
details.more summary:hover { color: var(--foreground); }
details.more div { padding-top: 4px; }
.alert { padding: 6px 10px; border: 1px solid color-mix(in srgb, var(--amber) 45%, var(--border)); border-radius: calc(var(--radius) - 2px); color: var(--amber); font-size: 12.5px; }
.alert ul { margin: 2px 0 0; padding-left: 18px; }
.say { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12.5px; }

.list { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
.row { display: grid; grid-template-columns: minmax(120px, 1fr) 150px minmax(0, 2.4fr) 90px; gap: 12px; align-items: start; padding: 10px 14px; border-top: 1px solid var(--border); font-size: 13.5px; }
.row:first-child { border-top: 0; }
.row.head { font-size: 12.5px; color: var(--muted-foreground); padding-top: 8px; padding-bottom: 8px; }
.row .miss { display: flex; flex-wrap: wrap; gap: 4px; }
.row .num { text-align: right; font-family: "Geist Mono", monospace; font-size: 12.5px; }
.ok-text { color: var(--green); }
.empty-state { display: grid; justify-items: center; gap: 2px; text-align: center; padding: 22px 16px; border: 1px dashed var(--border); border-radius: var(--radius); color: var(--muted-foreground); }
.empty-state .t { color: var(--foreground); }

@media (max-width: 639px) {
  .stats { gap: 8px; }
  .stat { padding: 10px; }
  .stat .v { font-size: 22px; }
  .stat .k { font-size: 11.5px; }
  .stat .d { display: none; }
  .row { grid-template-columns: 1fr auto; gap: 6px 10px; }
  .row.head { display: none; }
  .row .miss { grid-column: 1 / -1; }
  .row .num { display: none; }
}
</style>
</head>
<body>
<header class="site-header"><div class="container header-inner"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 16l5-5 4 4 7-8"/></svg></span><h1>Social Autopilot</h1><div class="meta" id="meta"></div></div></header>
<main class="container main" id="app">
  <noscript><div class="alert">Trang cần JavaScript để hiện dữ liệu.</div></noscript>
</main>

<script id="sa-data" type="application/json">/*__DATA__*/null</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("sa-data").textContent || "null");
  var app = document.getElementById("app");
  if (!D) { app.innerHTML = '<div class="alert">Chưa có dữ liệu. Chạy <code>node scripts/dashboard.mjs</code>.</div>'; return; }
  var LANG = { vn: "Tiếng Việt", vi: "Tiếng Việt", en: "English", de: "Deutsch", fr: "Français", ja: "日本語", ko: "한국어", zh: "中文" };

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmt(iso) { var d = new Date(iso); return isNaN(d) ? esc(iso) : pad(d.getHours()) + ":" + pad(d.getMinutes()) + " " + pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear(); }
  function lang(l) { return LANG[l] || String(l).toUpperCase(); }
  function brandName(id) { var b = D.brands.find(function (x) { return x.id === id; }); return b ? b.name : id; }
  function empty(title, sub) { return '<div class="empty-state"><span class="t">' + esc(title) + "</span>" + (sub ? '<span class="small">' + esc(sub) + "</span>" : "") + "</div>"; }
  function head(id, title, n) { return '<div class="section-head"><h2 id="' + id + '">' + esc(title) + '</h2><span class="count">' + n + "</span></div>"; }
  function copyBtn(text, label) { return '<button class="btn copy" type="button" data-copy="' + esc(text) + '" data-label="' + esc(label) + '">' + esc(label) + "</button>"; }

  // Brand tabs only when there are many brands.
  var showTabs = D.brands.length > 3, KEY = "sa-dashboard-brand", filter = "";
  if (showTabs) { try { filter = localStorage.getItem(KEY) || ""; } catch (e) {} }
  if (filter && !D.brands.some(function (b) { return b.id === filter; })) filter = "";
  function mine(x) { return !filter || x.brand === filter || x.id === filter; }

  function pic(url, label, alt) {
    var body = url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener"><img loading="lazy" src="' + esc(url) + '" alt="' + esc(alt) + '"></a>' : '<div class="none">Chưa có ảnh</div>';
    return '<div class="pic">' + body + (label ? '<span class="small muted">' + esc(label) + "</span>" : "") + "</div>";
  }

  function draftCard(d) {
    var swap = d.image_mode === "scene-swap";
    var pics = swap
      ? '<div class="pics two">' + pic(d.reference_image, "Ảnh gốc của shop" + (d.source_shop ? " (" + d.source_shop + ")" : ""), "Ảnh gốc") + pic(d.image, "Ảnh mới", "Ảnh mới") + "</div>"
      : '<div class="pics">' + pic(d.image, "", "Ảnh bài") + "</div>";
    var caps = d.captions.length ? d.captions.map(function (c) {
      return '<details class="cap"><summary>Caption ' + esc(lang(c.lang)) + ' <span class="muted small">' + c.text.length + " ký tự</span></summary><pre>" + esc(c.text) + "</pre></details>";
    }).join("") : '<div class="alert">Chưa có caption.</div>';
    var warn = d.problems && d.problems.length ? '<div class="alert">Cần xem lại:<ul>' + d.problems.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ul></div>" : "";
    return '<article class="card">' +
      '<div class="card-head"><span class="id">' + esc(d.id) + '</span><span class="tag">' + esc(brandName(d.brand)) + "</span>" + (swap ? '<span class="tag">scene-swap</span>' : "") + "</div>" +
      pics +
      '<p class="idea">' + esc(d.idea) + "</p>" +
      '<div class="line">' + d.networks.map(function (n) { return '<span class="tag">' + esc(n) + "</span>"; }).join("") + (d.inspiration ? '<a href="' + esc(d.inspiration) + '" target="_blank" rel="noopener">Bài tham khảo</a>' : "") + "</div>" +
      warn + '<div style="display:grid;gap:6px">' + caps + "</div>" +
      '<details class="more"><summary>Thư mục bản nháp</summary><div><code>' + esc(d.dir) + "</code></div></details>" +
      '<div class="say"><span class="muted">Nhắn agent</span><code>duyệt ' + esc(d.id) + "</code>" + copyBtn("duyệt " + d.id, "Chép") + '<span class="muted">hoặc</span><code>bỏ ' + esc(d.id) + ": lý do</code></div>" +
      "</article>";
  }

  function brandRow(b) {
    var st = b.usable ? '<span class="status c-green">Sẵn sàng</span>' : b.enabled ? '<span class="status c-red">Bật nhưng còn thiếu</span>' : b.missing.length ? '<span class="status c-amber">Tắt, còn thiếu</span>' : '<span class="status c-slate">Đủ, đang tắt</span>';
    var miss = b.missing.length ? b.missing.map(function (m) { return '<span class="tag">' + esc(m) + "</span>"; }).join("") : '<span class="ok-text">Không thiếu gì</span>';
    return '<div class="row"><span>' + esc(b.name) + "</span><span>" + st + '</span><span class="miss">' + miss + '</span><span class="num">' + b.sources + "</span></div>";
  }

  function render() {
    var brands = D.brands.filter(mine), drafts = D.drafts.filter(mine);
    var waiting = drafts.filter(function (d) { return d.status === "awaiting_approval"; });
    var approved = drafts.filter(function (d) { return d.brand_post; });
    var ready = brands.filter(function (b) { return b.usable; }).length;
    var stale = (Date.now() - new Date(D.generated_at)) / 36e5 > 24;
    var h = [];

    var refresh = '<span>Làm mới: <code>open-dashboard.cmd</code> hoặc <code>' + esc(D.refresh) + "</code></span>" + copyBtn(D.refresh, "Chép lệnh");
    var meta = document.getElementById("meta");
    meta.className = "meta" + (stale ? " stale" : "");
    meta.innerHTML = '<span class="when">Cập nhật ' + fmt(D.generated_at) + (stale ? " (cũ hơn 1 ngày)" : "") + '</span><span class="refresh-part">·</span><span class="refresh-part refresh-group">' + refresh + "</span>";
    h.push('<div class="meta phone-only">' + refresh + "</div>");
    if (D.errors && D.errors.count) h.push('<p class="warn">' + D.errors.count + " lỗi trong 24 giờ qua, xem <code>" + esc(D.errors.dir) + "</code></p>");

    if (showTabs) {
      h.push('<div class="tabs-list" role="tablist"><button type="button" role="tab" data-brand=""' + (filter ? "" : ' class="active"') + ">Tất cả</button>" +
        D.brands.map(function (b) { return '<button type="button" role="tab" data-brand="' + esc(b.id) + '"' + (filter === b.id ? ' class="active"' : "") + ">" + esc(b.name) + "</button>"; }).join("") + "</div>");
    }

    function stat(href, k, v, d, c) { return '<a class="stat" href="#' + href + '"><span class="k"><span class="dot" style="--c:var(--' + c + ')"></span>' + esc(k) + '</span><span class="v">' + v + '</span><span class="d">' + esc(d) + "</span></a>"; }
    h.push('<section class="stats" aria-label="Tổng quan">' +
      stat("s-waiting", "Chờ duyệt", waiting.length, "bản nháp đợi bạn xem", "amber") +
      stat("s-brands", "Thương hiệu sẵn sàng", ready + "<small>/" + brands.length + "</small>", "chạy được trong lịch", "green") +
      stat("s-waiting", "Đã duyệt", approved.length, "chưa đăng (Metricool làm sau)", "slate") +
      "</section>");

    h.push('<section class="section">' + head("s-waiting", "Chờ duyệt", waiting.length) +
      (waiting.length ? '<div class="cards">' + waiting.map(draftCard).join("") + "</div>" : empty("Không có bản nháp nào chờ duyệt", "Vòng chạy theo lịch sẽ thêm bản nháp mới ở đây.")) + "</section>");

    h.push('<section class="section">' + head("s-brands", "Thương hiệu", brands.length) +
      (brands.length ? '<div class="list"><div class="row head"><span>Thương hiệu</span><span>Trạng thái</span><span>Còn thiếu</span><span class="num">Nguồn bật</span></div>' + brands.map(brandRow).join("") + "</div>"
        : empty("Không tìm thấy thương hiệu nào", "Kiểm tra skillsRoot: " + D.skills_root)) + "</section>");

    app.innerHTML = h.join("");
  }

  document.addEventListener("click", function (e) {
    var tab = e.target.closest("[role=tab]");
    if (tab) { filter = tab.getAttribute("data-brand") || ""; try { localStorage.setItem(KEY, filter); } catch (err) {} render(); return; }
    var btn = e.target.closest(".copy");
    if (!btn) return;
    var text = btn.getAttribute("data-copy"), label = btn.getAttribute("data-label");
    var ok = function () { btn.classList.add("done"); btn.textContent = "Đã chép"; setTimeout(function () { btn.classList.remove("done"); btn.textContent = label; }, 1500); };
    var fallback = function () { var t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); ok(); } catch (err) {} t.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
  });
  render();
})();
</script>
</body>
</html>
